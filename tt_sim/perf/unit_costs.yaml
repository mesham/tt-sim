# Cycle costs for the units that are not the Tensix coprocessor: the NoC, DRAM,
# the baby RISC-V cores, the Mover, and L1 itself.
#
# The Tensix per-instruction table is the sibling file
# ``tt_sim/pe/tensix/tensix_instruction_costs.yaml``, which sits next to the
# instruction table it parallels (ROADMAP.md section I). These units have no
# YAML to sit next to, and what they do have is an arch-level constant table --
# ``tt_sim/arch/profile.py`` -- so this file lives next to the loader instead.
# Both files share one schema and one loader (``tt_sim/perf/costs.py``).
#
# CONSUMED by two sections, both through tt_sim/perf/model.py and both behind
# TT_SIM_COST_MODEL:
#
#   * ``riscv`` -> tt_sim/pe/rv/cost.py. Note what that consumer does *not* do
#     -- the load-latency table is spent as a load-use interlock, not as
#     occupancy, because the ISA docs define it as "N - 1 independent
#     instructions need to follow the load if the latency is to be entirely
#     hidden". ``load_throughput`` is consumed since 2026-08-06 as the other
#     half of the same paragraph: a rate limiter of four in-flight slots, each
#     held N - 1 cycles, which is the docs' "four such loads every N - 1
#     cycles" and is ALSO what the table's "Maximum loads in flight" column
#     says, so that column stays unconsumed rather than being charged twice.
#     See its entry, and docs/plans/cost-model.md.
#   * ``noc.hops`` -> tt_sim/network/tt_noc.py, as the flight time of a packet:
#     ``endpoint + per_hop * hops``, with the hop count a forward distance on
#     each NoC's own (directional, wrapping) torus. ``noc.flit_bits`` and the
#     hops' ``throughput_flits_per_cycle`` go to the same consumer as
#     *bandwidth*, which is an occupancy rather than a latency: a packet holds
#     the injecting NIU's link for one cycle per flit and its tail lands that
#     much after its head. Still unconsumed under ``noc``: the L1 port count
#     and the router buffers, i.e. everything that would model one packet
#     waiting behind *another's*.
#
#   * ``dram.access_latency`` -> tt_sim/device/tiles.py, as the time a DRAM
#     endpoint holds an arriving request before it services it. Deliberately
#     not part of the flight above: a flight time is a property of the
#     distance, this is a property of the device, and keeping them apart is
#     what lets the number be derived without double-counting the hops.
#     Derived on **both** arches now (99 Wormhole, 126 Blackhole); Blackhole's
#     was a gap until the two things blocking it were chased down and both
#     turned out not to be about Blackhole's DRAM.
#
#   * ``dram.channel_serialisation`` -> the same consumer, since 2026-08-04,
#     as the *second* serialisation a DRAM transfer pays: the GDDR6 channel is
#     a different queue from the NoC link and a slower one (24 B/cycle against
#     32 on Wormhole), so the endpoint charges the excess of the channel's
#     time over the link's and the transfer ends up limited by the slower of
#     the two. Both arches now, since 2026-08-12, but by two different routes
#     and not with the same shape: Wormhole's one figure is a unit conversion
#     of a published GB/s and is charged in both directions, while Blackhole's
#     is a two-point secant on tt-metal's measured NoC dataset. That figure is
#     spent on two axes -- as a latency excess and as the channel's occupancy
#     -- and on Blackhole they carry different directions: the latency axis is
#     charged to READS ONLY, because the vendor's own write row shows a write's
#     completion time does not contain the channel, while the occupancy axis is
#     charged both ways, because no latency row can see an occupancy and a
#     write's bytes cross the same bus. See the override and its nested
#     ``write_occupancy``, which say why each half is a finding and not a gap.
#     Everything else under ``dram`` -- the GB/s ``bandwidth`` block itself,
#     ``chip_level_bandwidth`` and the end-to-end reference -- is still
#     unconsumed.
#
# The ``mover`` section's ``transfer`` rates are consumed since 2026-08-06 by
# ``MoverCostModel`` (tt_sim/perf/model.py): a Mover transfer holds the mover
# unit for ceil(bytes / ideal rate) cycles. The ``l1`` section has no consumer.
# See docs/plans/cost-model.md for the schema, the provenance convention, and
# what calibration would take.
#
# The provenance vocabulary and the cost-value form (int, or a mapping with
# ``cycles`` plus ``bound`` in {exact, at_least, at_most, approximate, range})
# are documented at the top of tensix_instruction_costs.yaml and are identical
# here. The short version, because it is the point of the exercise:
#
#   isa_doc > isa_doc_derived > vendor_source > vendor_source_derived
#           > estimated > unknown
#
# and an entry's provenance is the weakest provenance of any number in it.
# ``vendor_source_derived`` is the newest rank and exists for exactly five
# entries (``dram.access_latency`` once per arch, its Blackhole ``write``
# split, Blackhole's ``dram.channel_serialisation`` and that entry's nested
# ``write_occupancy``): arithmetic on vendor numbers, which is what
# ``isa_doc_derived`` is to ``isa_doc``, one tier down. It requires a
# ``derivation`` for the same reason -- a derived number is only reviewable if
# the arithmetic is written out. Note what the rank does NOT require: a
# published *page*. Blackhole has no DRAM tile page and two of its DRAM terms
# are derived anyway, from measured vendor tables, because what the rank asks
# for is vendor numbers and written-out arithmetic.

schema_version: 1

documents:
  repo: https://github.com/tenstorrent/tt-isa-documentation
  wh_noc: WormholeB0/NoC/README.md
  wh_noc_memmap: WormholeB0/NoC/MemoryMap.md
  wh_dram: WormholeB0/DRAMTile/README.md
  wh_l1: WormholeB0/TensixTile/L1.md
  wh_riscv: WormholeB0/TensixTile/BabyRISCV/README.md
  wh_eth_riscv: WormholeB0/EthernetTile/BabyRISCV/README.md
  wh_mover: WormholeB0/TensixTile/Mover.md
  wh_ttinsn: WormholeB0/TensixTile/BabyRISCV/PushTensixInstruction.md
  bh_noc: BlackholeA0/NoC/README.md
  bh_riscv: BlackholeA0/TensixTile/BabyRISCV/README.md
  bh_vector_unit: BlackholeA0/TensixTile/TensixCoprocessor/VectorUnit.md
  bh_ttinsn: BlackholeA0/TensixTile/BabyRISCV/PushTensixInstruction.md

vendor_documents:
  repo: https://github.com/tenstorrent/tt-metal
  version_read: "0.74"
  tm_dm_common: ttnn/cpp/ttnn/operations/data_movement/common/common.cpp
  tm_noc_latencies: tt_metal/impl/experimental/noc_estimator/latencies/noc_latencies.yaml
  tm_noc_estimator_readme: tt_metal/api/tt-metalium/experimental/noc_estimator/README.md
  tm_operation_cpp: ttnn/core/operation.cpp
  tm_conv2d_common: ttnn/cpp/ttnn/operations/conv/conv2d/conv2d_op_program_factory_common.cpp
  tm_noc_estimator_test: tests/tt_metal/tt_metal/data_movement/noc_estimator_tests/test_noc_estimator.cpp
  tm_dm_constants: tests/tt_metal/tt_metal/data_movement/python/constants.py
  tm_dm_stats: tests/tt_metal/tt_metal/data_movement/python/stats_collector.py
  tm_cluster: tt_metal/llrt/tt_cluster.cpp
  umd_bh_impl: tt_metal/third_party/umd/device/api/umd/device/arch/blackhole_implementation.hpp
  tm_dram_saturation: tech_reports/Saturating_DRAM_bandwidth/Saturating_DRAM_bandwidth.md
  tm_memory_for_kernels: docs/source/tt-metalium/tt_metal/advanced_topics/memory_for_kernel_developers.rst

# ---------------------------------------------------------------------------
clock:
  wormhole:
    frequency_mhz: 1000
    provenance: isa_doc
    source: wh_riscv
    note: >
      "Each RISCV core is intended to execute one RV32IM instruction per cycle,
      running at a clock speed of 1 GHz." The Matrix Unit page independently
      quotes "Wormhole's standard 1 GHz clock rate".
  blackhole:
    frequency_mhz: 1350
    frequency_idle_mhz: 800
    provenance: isa_doc
    source: bh_riscv
    note: >
      "running at a clock speed of 1.35 GHz", and the Blackhole Vector Unit
      page says the SFPU "clocks at 1.35 GHz rather than 1 GHz".

      **The 1.2 GHz conflict this note used to record is resolved: it was one
      stale constant, in one function, on a path that never touches a latency.**
      Chased 2026-08-03 because it was one of the two things blocking a
      Blackhole DRAM latency. What the vendor tree actually says:

      * UMD -- the layer that talks to the chip -- defines Blackhole
        AICLK_BUSY_VAL = 1350 and AICLK_IDLE_VAL = 800 (umd_bh_impl), against
        Wormhole's 1000 / 500. AICLK is DVFS-managed, so 1.35 GHz is the busy
        point and 0.8 GHz the idle one; "the Blackhole clock" is 1.35 GHz under
        load and nothing else in the tree contradicts that.
      * tt-metal does not assume it at all where it matters: it *reads* AICLK
        from the device (``Cluster::get_device_aiclk`` -> the UMD
        ``get_clock()`` ARC message, tm_cluster:739), and the device profiler
        takes its ``device_core_frequency`` from that call. The data-movement
        suite that produced every measurement in this file reports "Latency
        (cycles)" from the RISCV wall clock and converts to GB/s with the
        *device-logged* clock, falling back to a hardcoded 1.35 GHz for
        Blackhole when the run did not log one (tm_dm_constants:15-19,
        tm_dm_stats:227-230).
      * 1.2 GHz appears exactly once in the tree, as ``device_frequency_hz`` in
        tm_dm_common's ``get_cycles_for_transaction_size``, and it multiplies
        only the *bandwidth* term: ``cycles = bytes * freq / (bw * 1e9)``. The
        ``latency_cyles`` that function returns alongside it -- the four
        constants under ``dram.end_to_end_reference`` -- are returned unscaled
        and are measured cycle counts, not converted times.

      So the clock never entered the measurements this file derives from, and
      the 12.5% swing it would have implied does not exist. Elsewhere in
      tt-metal 1350 is used consistently (fabric test infra, the ttnn
      benchmark's ``device_freq``, the distributed socket analysis'
      CYCLES_PER_US), which is why the single 1.2 is best read as stale.

# ---------------------------------------------------------------------------
noc:
  note: >
    The ISA docs publish a clean per-hop model: a fixed latency per hop and one
    flit per cycle per axis. That is exactly the shape Phase 5 of the pump plan
    wants ("NoC requests gain per-hop latency by scheduling the destination's
    request event at c + hops * latency instead of c + 1"), and it is fully
    sourced. What is *not* sourced anywhere is congestion: the docs say
    congestion "can negatively impact latency" without quantifying it, and
    neither vendor tree has an intra-chip per-hop congestion model.

    CONSUMED since 2026-08-03 by tt_sim/network/tt_noc.py, exactly as written
    above: a packet is delayed by ``2 * ~5 + 9 * hops`` before the destination
    NIU services it. The hop count is the *forward* distance on the NoC's own
    torus, so it is directional -- an outbound and a return trip between two
    tiles differing on both axes always sum to noc_grid_x + noc_grid_y hops.

    CONSUMED since 2026-08-03 also as *bandwidth*, which is a different shape
    from the hop model: not a latency but an occupancy of a link. ``flit_bits``
    (256 Wormhole / 512 Blackhole) with ``throughput_flits_per_cycle: 1`` gives
    32 and 64 bytes per cycle, so a packet of N flits holds the injecting NIU's
    link for N cycles and its tail arrives N-1 cycles after its head -- once,
    not once per hop, because a wormhole-routed NoC lets the tail follow the
    head rather than re-assembling the packet at each router. That is what
    makes a 32-byte semaphore poke cheaper than an 8 KiB tile read, which the
    hop term alone cannot express because it never sees a size. Note the two
    bandwidth figures here are one fact recorded twice and they agree exactly:
    ``link_bandwidth_gb_per_s: 32`` is 256 bits/cycle at the ``clock``
    section's 1 GHz. No Blackhole GB/s is published, hence the ``unknown``
    override rather than a scaled Wormhole number.

    CORROBORATED 2026-08-03 against measurement, on both architectures, and
    this is the strongest external check anything in this file has. tt-metal's
    740-entry ``tm_noc_latencies`` dataset keys every row on ``same_axis``, and
    its harness (tm_noc_estimator_test:191-193) picks the subordinate core as
    logical ``{0,1}`` when same_axis is set and ``{1,1}`` when it is not. So
    the same-axis pair shares a NoC column and the different-axis pair does
    not, and on a directional torus their *round trips* are exactly
    ``noc_grid_y`` and ``noc_grid_x + noc_grid_y`` hops -- whatever the actual
    coordinates. The measured difference is therefore ``noc_grid_x`` hops of
    pure router-to-router latency with the endpoints, the DRAM and the issuing
    core's path all cancelled out:

      Wormhole  (grid_x = 10):  293 - 205 =  88 cycles -> 8.8  cycles/hop
      Blackhole (grid_x = 17):  373 - 226 = 147 cycles -> 8.65 cycles/hop

    (both at 64 B, one transaction, ONE_FROM_ONE read; across all 11
    transaction sizes and the read/write/stateful variants the eight series
    give 8.3-9.4, mean 9.0.) The ISA docs' 9-cycle hop is reproduced on both
    arches to within 4%, from a dataset that never mentions hops -- and it
    settles that Blackhole's NoC is modelled correctly, which is what the
    ``dram.access_latency`` note below needed to know.

    CONSUMED since 2026-08-05 in a THIRD place, and it is the same number a
    third time rather than a new one: each router-to-router link a packet
    crosses is held for the same N cycles, by ``NocLinkRegistry`` on the
    device. So a packet waits behind ANOTHER TILE's traffic where their routes
    cross, which is what makes two flows sharing one link each cost one extra
    occupancy -- the effect measured on a Blackhole card and recorded under
    ``congestion`` below and in ``arch_overrides.blackhole.noc``. It is inert
    for a single flow, because that flow's packets already leave its injection
    port one occupancy apart and so reach every link on their route one
    occupancy apart. ``hops.router_to_router.throughput_flits_per_cycle: 1``
    is the entry being spent, and it was already here at ``isa_doc``.

    Still unconsumed: ``l1_ports`` and ``router_buffering``. With them goes the
    part of cross-packet contention that is *arbitration* rather than
    occupancy -- which virtual channel wins a link both packets want, and how
    deep a router will buffer before it back-pressures. A link's bandwidth is
    now divided between the packets crossing it; the order they cross it in is
    first-come, and THAT ORDER IS PUBLISHED -- this line used to say nothing
    published it, which was simply wrong. Two vendor documents state it, and
    both CONFIRM the mechanism ``NocLinkRegistry`` already implements rather
    than asking for a change:

      ``tm_dram_saturation``: "the NoC will serve on the requests in a
      first-come first-serve strategy within the same VC. With different VC for
      each reader, the NoC can round-robin through different channels, and
      serve two readers equally."

      ``tm_memory_for_kernels``: "It can lead to NoC contention since each link
      can only carry one packet at a time. When multiple packets attempt to
      traverse the same link, one must wait, causing delays and reduced
      throughput."

    The second is the registry's whole mechanism in one sentence -- one packet
    per link, the rest wait -- and the first names the arbitration rule the
    registry gets by construction, because a watermark per link serves whoever
    reaches it first. NO NUMBER FOLLOWS FROM EITHER and no cycle moved when
    they were added: they are `vendor_source` *corroboration* of an
    `isa_doc_derived` term, not a new charge. What the first quotation also
    settles is the SHAPE of what is left unmodelled: round-robin across
    DIFFERENT VCs is a second policy, it is measured at one fiftieth of the
    effect (see ``congestion`` below), and no vendor document turns either
    policy into cycles. So the residue is buffer back-pressure and virtual
    channels -- not the order, which is now cited.
  hops:
    niu_to_router:
      latency: { cycles: 5, bound: approximate }
      throughput_flits_per_cycle: 1
      provenance: isa_doc
      source: wh_noc#performance
      note: the doc writes this as "~5 cycles"; the tilde is preserved as bound approximate.
    router_to_router:
      latency: 9
      throughput_flits_per_cycle: 1
      per_axis: true
      provenance: isa_doc
      source: wh_noc#performance
      note: >
        "One flit (256 bits) per cycle per axis", latency 9 cycles. The L1 page
        restates the latency independently: "the latency of each hop is at
        least 9 cycles". Identical on Blackhole (bh_noc); only the flit width
        differs.
    router_to_niu:
      latency: { cycles: 5, bound: approximate }
      throughput_flits_per_cycle: 1
      provenance: isa_doc
      source: wh_noc#performance
  flit_bits: 256
  link_bandwidth_gb_per_s: 32
  packet_framing:
    header_flits: 1
    max_data_flits: 256
    provenance: isa_doc
    source: wh_noc
    note: >
      "Each NoC transaction consists of one or more packets. Each packet
      consists of one or more flits (exactly one header flit, followed by up to
      256 data flits)." The same page adds the sentence that makes this a cost
      rather than a curiosity: "The amount of *useful* throughput depends on
      the ratio of header flits to data flits; very short packets can use just
      a single header flit to transport 4 bytes of data, whereas very long
      packets use one header flit and 256 data flits to transport 8192 bytes of
      data." Identical on Blackhole with 512-bit flits and a 16 KiB maximum.

      RECORDED 2026-08-04 and DELIBERATELY UNCONSUMED, which is a different
      statement from the one this file used to make. ``NocCostModel.
      packet_flits`` declined to count a header on the ground that the docs did
      not say how many flits one takes. They do, they say exactly one, and that
      docstring was wrong. What stopped it being wired is the size of the
      change against the size of the term:

        * it is a **whole-tree timing perturbation**. A 32-byte semaphore poke
          is one data flit today and would become two, so its modelled link
          occupancy doubles; that is the most common packet in every workload
          in the tree.
        * it is worth 1 cycle per packet, i.e. per ``ceil(N / 8192)`` bytes on
          Wormhole = 0.125 cycles/KiB, against a measured L1 bandwidth
          shortfall of 3.94 cycles/KiB reading and 2.65 writing. It closes
          **3 % of the read gap and 6 % of the write gap**, and being
          direction-symmetric it explains none of the asymmetry between them.

      So it is a real, sourced, small term that belongs in its own change with
      its own guard run, not a ride-along on a DRAM instalment. See
      docs/plans/cost-model.md, "Is the ~10% L1 read shortfall sourceable?",
      for the rest of that arithmetic and for what the docs positively rule
      out (there is no credit-based flow control described anywhere in either
      NoC tree, and no "in practice ~X% of theoretical" caveat for the NoC of
      the kind ``dram.bandwidth`` carries).
  request_packet_flits:
    read_request: 1
    write_ack: 1
    inline_write_request: 1
    atomic_request: 1
    atomic_response: 1
    provenance: isa_doc
    source: wh_noc_memmap#noc_cmd_ctrl
    note: >
      The request/response shapes, from the ``NOC_CMD_CTRL`` table: "A read
      request packet consisting of a single flit travels from the initiating
      NIU to NOC_TARG_ADDR, and then a read response packet (consisting of
      multiple flits) containing the data travels back to NOC_RET_ADDR"; a
      write's acknowledgement is likewise "a write acknowledgement packet
      consisting of a single flit"; atomics are single-flit in both directions.

      Unconsumed for the same reason as ``packet_framing`` and with a smaller
      claim on anybody's attention: these packets travel on the *opposite*
      link from the one carrying the bytes, so they cost a large transfer
      nothing at all. Recorded because "does the request leg's framing explain
      the read-versus-write asymmetry?" is a question this file should be able
      to answer with a number, and the number is no.
  l1_ports:
    read_connections: 2
    write_connections: 2
    bits_per_connection: 128
    provenance: isa_doc
    source: wh_l1#port-assignments
    note: >
      "Each NoC has four 128-bit connections to L1: two for reading and two for
      writing ... This theoretically allows each NoC to read 256 bits per cycle
      and write 256 bits per cycle."
  router_buffering:
    bytes_per_inbound_port: 2048
    guaranteed_bytes_per_vc: 32
    shared_pool_max_bytes_per_vc: 480
    provenance: isa_doc
    source: wh_dram#performance
    note: >
      Recorded because head-of-line blocking (ROADMAP section I "NoC timing
      model") is a buffering property, not a latency constant, and this is the
      only published description of the buffers. Not enough on its own to model
      contention.
  provenance: isa_doc
  source: wh_noc#performance
  congestion:
    provenance: unknown
    note: >
      No published model. The ISA docs say congestion "can negatively impact
      latency" and that ordering flags (NOC_CMD_VC_LINKED / NOC_CMD_VC_STATIC)
      and PATH_RESERVE broadcasts make it worse, all qualitatively. tt-metal
      has a 740-entry measured end-to-end latency table
      (tm_noc_latencies, described by tm_noc_estimator_readme as "empirically
      measured latency data (collected by the data movement test suite)"),
      keyed by transaction size, pattern, memory type and subordinate count --
      but that is end-to-end, so it folds hop count, congestion, DRAM and the
      RISC-V issue path into one number and cannot be decomposed into a per-hop
      congestion term. It is the right thing to *validate* a congestion model
      against; it is not itself one.

      TESTED, 2026-08-05, rather than left as an assertion. The reason it
      cannot supply one is sharper than "too coarse", and it is
      identifiability: every multi-party row in that file changes the number
      of concurrent flows by RESIZING A GRID (2x2, 3x3, 5x5, 8x8, the whole
      device, all anchored at logical (0,0)), so the flow count, the path
      lengths and the link sharing move together in four or five steps and no
      two rows hold any of them fixed. The file records no core coordinates,
      and its one scalar per key already contains the issuing core's loop --
      which the retained rows measure at ~100 cycles per transaction, and
      which dominates the multi-party rows at small transaction sizes -- plus
      L1 port arbitration. One equation, three unknowns. A coefficient fitted
      through that would be `provenance: estimated`, which this file does not
      have; `vendor_source_derived` is not available either, because no
      arithmetic on the published numbers isolates congestion from the other
      two terms. What the dataset DOES give is a bound: all-to-all over an
      N-core grid at 64 KiB shows aggregate bandwidth rising 3.4x (Wormhole)
      and 6.0x (Blackhole) for 14x and 28x the cores, i.e. the per-core share
      falling ~4x. Any congestion model tt-sim gains must reproduce that curve.
      `python3 -m tt_sim.perf.noc_dataset_sweep` prints the whole argument
      with the numbers, and names the four hardware measurements that would
      settle it.

      MEASURED ON A BLACKHOLE CARD, 2026-08-05, and it is still not a number
      this table can carry. `perfbench/nocbench` put two flows on a searched
      geometry in which only the payload link overlap moves. At 64 B per transaction the
      series is flat (slope -0.00, span 0.1 cycles against a 0.5-cycle noise
      floor), which is the designed negative control. At 16 KiB the cost per
      transaction goes 268.8 -> 518.3 between ZERO and ONE shared link and then
      stops moving (516.6, 511.6 at two and three). 16384 B / 64 B per cycle is
      256 cycles of link occupancy; one flow costs 269, two flows sharing one
      link cost 518. That is one link's bandwidth being split between the
      saturating flows crossing it -- a STEP, not a slope, and not a per-hop
      latency adder. Writing 250 cycles into a per-shared-link slot would be
      false to the measurement, not conservative about it: it would charge two
      shared links twice what it charges one, and the card charges the same.
      The endpoint curve agrees: six 4096 B flows into one subordinate come back
      at 137 / 202 / 268 / 333 / 399 / 399 cycles per transaction, evenly spaced
      by ~65.5 where 4096 / 64 is 64.

      RE-MEASURED ACROSS SIX TRANSACTION SIZES, same day, same card, separate
      run (tt_sim/perf/datasets/nocbench-blackhole-sizes.csv), and THAT CHANGED
      THE VERDICT ABOVE ABOUT WHAT IS EXPRESSIBLE -- though not about what is
      wired. The 0-to-1-shared-link delta is 0.0 / 0.0 / 28.1 / 63.1 / 124.5 /
      250.4 cycles at 64 / 512 / 2048 / 4096 / 8192 / 16384 bytes, against
      occupancies (bytes / 64) of 1 / 8 / 32 / 64 / 128 / 256. Above the
      ~40-cycle issue loop THE DELTA IS THE OCCUPANCY, to 0.88 / 0.99 / 0.97 /
      0.98; below it, nothing happens at all. So the effect is not an
      unquantified arbitration term at all -- it is
      ``hops.router_to_router.throughput_flits_per_cycle: 1`` (isa_doc, already
      in this file, currently spent only at the injecting NIU) being spent on
      each router-to-router link a packet crosses. That needs NO NEW NUMBER and
      would be `isa_doc_derived`, with the silicon above as corroboration -- see
      ``arch_overrides.blackhole.noc``.

      WIRED, 2026-08-05, and NOT AS AN ENTRY HERE -- there is still no
      congestion number in this file and this line still reads `unknown`. What
      was wired is ``hops.router_to_router.throughput_flits_per_cycle``, on
      each link rather than only at the injecting NIU; see the ``noc`` note
      above for the mechanism and docs/plans/cost-model.md for the instalment.
      The three build items that had blocked it were built: ``NocLinkRegistry``
      holds one free-cycle watermark per link and lives on the DEVICE (a link
      is crossed by every tile whose route passes through it, so it cannot be
      NIU state); ``noc_route_links`` gives the network layer the hop ORDER a
      link identity needs, and is literally the same function the experiment
      planner names its links with; and a multicast claims the union of its
      destinations' routes ONCE, so the fan-out is not serialised against
      itself on the launch-message path.

      What tt-sim then reproduces, run through the same harness as the card
      (perfbench/nocbench/src/nocbench-blackhole-sim-links.report.txt): 0.0
      cycles at 512 B, +59.4 at 4096 B against an occupancy of 64, the whole
      effect at the FIRST shared link, and every uncontended figure in the file
      -- the hop line, the size control, the readport control -- unchanged from
      the same run before the term existed. No parameter was fitted.

      WHAT ``congestion`` STILL MEANS, now narrowed. The docs' one named
      mechanism is virtual-channel arbitration, and it has now been measured
      separately: two writers on one shared link, one pinned at VC 1 and the
      other swept 0-3, cost 519.8 / 528.5+532.4 / 519.9 / 519.9 cycles per
      transaction at 16 KiB. Different channels DO NOT avoid the split (all four
      points are ~1.94x the uncontended 268), and sharing a channel costs a
      further 2.0 % (10.5 cycles) on top. So VC arbitration is real, is worth
      one fiftieth of the effect, and is the part that stays `unknown` here.

      THE ARBITRATION *ORDER*, though, is no longer part of what is unknown, and
      the ``noc`` note above now carries the two vendor quotations that settle
      it: ``tm_dram_saturation`` states first-come first-serve within a VC and
      round-robin across VCs, ``tm_memory_for_kernels`` states one packet per
      link with the rest waiting. Both CONFIRM the wired term. Neither carries a
      number, so this entry still reads `unknown` and no cycle moved -- what
      shrank is the claim, not the model. What remains genuinely unmodelled is
      **buffer back-pressure and virtual channels**: the static router geometry
      is published (see ``router_buffering``) but no rule turns it into cycles,
      and a queue-depth bound would be `estimated` in the OVER-charging
      direction, which this file refuses for the same reason it refuses
      PC-buffer write delays. It is ~2 % of the measured effect.

      VALIDATED END TO END, 2026-08-12, which the term had never been. It was
      inert on every in-tree workload (3,960 link claims and zero waits on
      `blackhole/six`), so the only evidence it was not dead code was the
      archived nocbench run. The blocker was that the congestion probes could
      not reach the simulator: `perfbench/run.sh` and `run_card_session.sh`
      both exported `TT_SIM_TENSIX_COORDS`, which tt-sim reads as "the pool is
      PINNED" and which switches off on-demand materialisation, so a multi-core
      plan died on its first kernel launch. With that removed the probe runs on
      both arches and the term FIRES: Blackhole 7,590 link claims / 45 waits,
      Wormhole 6,580 / 69, against the zero waits every in-tree workload gives.
      The step at one shared link is FLAT at 64 B and 512 B and then, on
      Blackhole, +27.5 / +119.0 / +239.5 cycles at 2048 / 8192 / 16384 B against
      occupancies (bytes / 64) of 32 / 128 / 256. The card's own step over the
      same sizes is 0.0 / 0.0 / +28.1 / +124.5 / +250.4, so the two agree to
      2-4.5 % WITH NOTHING FITTED -- the modelled step is `bytes / flit_bytes`
      out of `flit_bits` and `throughput_flits_per_cycle`, both `isa_doc` and
      both in this file before that campaign existed. Wormhole's steps are
      +59.0 / +239.0 / +495.5, twice Blackhole's, which is the 256-bit flit
      against the 512-bit one and is likewise not a fitted number. There is no
      Wormhole silicon to check it against; that is a hardware booking.

# ---------------------------------------------------------------------------
dram:
  note: >
    ROADMAP section I asks for "latency + bandwidth for NoC and DRAM". Bandwidth
    is well sourced; DRAM *latency* is the clearest gap in this file, and it is
    a gap in the sources, not an omission here.
  bandwidth:
    per_channel_gb_per_s: 24
    channels: 12
    aggregate_gb_per_s: 288
    achievable_fraction: 0.92
    provenance: isa_doc
    source: wh_dram#performance
    note: >
      "Running at the typical speed of 12 GT/s, each GDDR6 channel is
      theoretically capable of reading at 24 GB/s or writing at 24 GB/s ...
      With twelve channels per Wormhole ASIC, this is 288 GB/s in aggregate ...
      in practice well-written software can expect to achieve approximately 92%
      of the theoretical maximum bandwidth." The page also carries measured
      tables (1/12/48 Tensix tiles against 1 or 12 channels, static vs dynamic
      VC) showing 22.2-22.3 GB/s for reads, and a dramatic 21.9 -> 7.6 GB/s
      collapse for 12-tile writes with dynamic VC allocation -- worth reading
      before trusting any single bandwidth number.
  channel_serialisation:
    bytes_per_cycle: 24
    provenance: isa_doc_derived
    source: wh_dram#performance
    derivation: >
      bytes_per_cycle = bandwidth.per_channel_gb_per_s / (clock.wormhole.frequency_mhz / 1000)
                      = 24 GB/s / 1 GHz
                      = 24e9 bytes/second / 1e9 cycles/second
                      = 24 bytes per cycle.

      Both inputs are ``isa_doc``: the 24 GB/s is the DRAM tile page's
      "each GDDR6 channel is theoretically capable of reading at 24 GB/s or
      writing at 24 GB/s" (12 GT/s, decimal GB, so 24e9 B/s), and the 1 GHz is
      the ``clock`` section's, restated by two separate ISA doc pages. The
      whole derivation is a unit conversion; no measurement enters it.

      This is the *same shape* as ``noc.link_bandwidth_gb_per_s: 32`` being
      256 bits/cycle at the same clock -- one fact recorded twice, in the two
      forms the two consumers want -- and a test asserts the two forms agree.
    note: >
      CONSUMED since 2026-08-04 by tt_sim/device/tiles.py, as the *second*
      serialisation a DRAM transfer pays. It exists because the ``noc``
      section's per-link bandwidth and this one are two different queues at two
      different rates -- 32 B/cycle on the wire, 24 B/cycle at the channel --
      and a DRAM transfer is limited by the slower.

      What the endpoint charges is the **excess**, not the whole thing:

        extra = max(0, ceil(N / 24) - ceil(N / link_bytes_per_cycle))

      so the size-dependent cost of a DRAM transfer over the round trip is
      ceil(N / 24) once, never the sum of the two. Charging the whole channel
      time on top of the link's would be exactly the double-billing that the
      ``access_latency`` note below used to (wrongly) fear from consuming this
      section at all; charging the excess is the standard two-stage-pipeline
      result, where a stream through two stages in series runs at the
      bottleneck rate and the faster stage contributes only its fill, which is
      a constant and is already inside ``access_latency``.

      CONSUMED A SECOND WAY since 2026-08-09, and it is the same number rather
      than another one: the channel is *occupied* for ceil(N / 24) cycles, so a
      request arriving while it is busy waits. The excess above is what one
      transfer's size costs in latency; this is what it costs everyone behind
      it, and one figure spent on those two axes is exactly what
      ``noc.hops.router_to_router.throughput_flits_per_cycle`` already is (a
      packet's tail, its NIU's injection port, and every router link it
      crosses). The claim is zero whenever the channel is idle, so no
      single-transfer prediction moves and rung 2's rows are untouched; what
      moves is a *sustained* rate, which before this charge ran at the NoC
      link's 32 B/cycle -- above the 24 this very entry publishes for the
      channel.

      Still not modelled, and none of it folded in here: the DRAM device's own
      re-issue interval (``access_latency`` is a latency and nothing publishes
      the pipelining behind it, so occupancy stops at the bus), bank conflicts,
      refresh windows, read/write turnaround, and the docs' own 92% achievable
      fraction -- which is a statement about sustained software behaviour, not
      about one transfer, and folding it in here would be an efficiency fudge
      of exactly the kind these tables refuse.

      A MEASURED DISCREPANCY AGAINST THE DIRECTION-SYMMETRY OF THIS ENTRY,
      recorded because it is worth knowing and DELIBERATELY NOT ACTED ON. The
      24 above is charged to reads and writes alike because the page states one
      figure for both ("reading at 24 GB/s or writing at 24 GB/s"). A Wormhole
      card session (``2026-08-17``, dramratebench ``--dir both``, participants
      concentrated on one endpoint, two independent runs agreeing to 0.3%, all
      instrument gates clean) measured read 22.117 B/cycle against write 21.215
      at 64 participants -- ratio 0.959 -- and 22.023 against 21.273 at 48,
      ratio 0.966. The read arm lands where the page's own measured table
      already says it does (22.2-22.3 GB/s, and 24 x the page's 0.92 achievable
      fraction is 22.1); the write arm is a reproducible 3.4-4.1% below it.

      That is one part, one operator, one day, against a PUBLISHED number, and
      it is nowhere near enough to move one. It also cannot separate the three
      things it could be -- a genuine write deficit at the bus, the read/write
      turnaround this entry already names as unmodelled, or the write arm's own
      outbound-link topology, which the instrument's own notes flag as
      different in kind from the read arm's. What would settle it is a document
      or a vendor dataset with a Wormhole write rate in it, and neither exists:
      the same subtraction on ``tm_noc_latencies``' Wormhole rows returns 24.53
      B/cycle for writes, i.e. no deficit at all and if anything a faster write.
      So this stays a corroboration-shaped note with the sign recorded, and
      Wormhole keeps one channel rate for both directions.
  access_latency:
    provenance: unknown
    note: >
      No document publishes one. The ISA docs give DRAM no access latency at
      all -- no tCL/tRCD-style device timing, no bank-conflict cost, no
      refresh-window cost, despite ROADMAP section I naming exactly those.
      Neither ttsim (whose DRAM is instantaneous) nor tt-metal's hardware
      headers have one either.

      So the base entry stays ``unknown`` and each arch overrides it with a
      derived figure -- 99 Wormhole, 126 Blackhole -- under
      ``arch_overrides.<arch>.dram.access_latency``. Both are the difference of
      two of tt-metal's measured end-to-end rows; see each entry for its own
      arithmetic and its own cross-check. Both are also **read** figures, and
      Blackhole additionally carries a ``write`` sub-entry (22 cycles) because
      its measured rows separate the two directions cleanly and Wormhole's do
      not. So "the DRAM access latency" is one number per arch on Wormhole and
      two on Blackhole, and each entry says which it is.

      **Blackhole's used to be a gap and the record of why is kept here**,
      because it was closed by finding out that neither reason was about
      Blackhole's DRAM. The two were: (1) its end-to-end row set failed the
      consistency check Wormhole's passed -- subtracting the modelled NoC round
      trip leaves 36 / 38 / 41 on Wormhole but 68 (local) against 122 / 123
      (remote) on Blackhole; and (2) the figures were believed to have been
      measured against tt-metal's 1.2 GHz Blackhole assumption while the ISA
      docs say 1.35, a 12.5% swing on the quantity being derived.

      (2) is void: the end-to-end figures are measured cycle counts and no
      clock enters them -- see the ``clock`` note, which chases the single 1.2
      in the tree to a bandwidth conversion that never touches them.

      (1) is real but is *not* about the two rows the subtraction uses. The
      per-hop model is now independently confirmed on Blackhole (see ``noc``:
      8.65 cycles/hop measured against the docs' 9, from the same-axis delta),
      so the 29-hop round trip is not what is wrong. What is left is that
      Blackhole's ``l1_local_cycles`` row -- 88 -- does not sit with its own
      remote rows: taking the 740-entry ``tm_noc_latencies`` set instead, whose
      campaign has no local row at all, the residual after the modelled round
      trip is 75 on Wormhole and 92 on Blackhole, a 17-cycle arch difference
      rather than an 81-cycle one. The anomaly is confined to a single
      constant, that constant is the *local* one, and the derivation subtracts
      ``dram_cycles - l1_remote_read_cycles``, neither of which is it. Why 88
      is what it is remains unexplained and is a real open question about the
      end-to-end reference; it is no longer a reason not to subtract two rows
      that are consistent with each other and with the hop model.
  end_to_end_reference:
    dram_cycles: { wormhole: 358, blackhole: 529 }
    l1_local_cycles: { wormhole: 56, blackhole: 88 }
    l1_remote_write_cycles: { wormhole: 256, blackhole: 404 }
    l1_remote_read_cycles: { wormhole: 259, blackhole: 403 }
    provenance: vendor_source
    source: tm_dm_common#L200-216
    note: >
      NOT a DRAM latency and NOT to be plugged in as one. These are tt-metal's
      measured initial latencies for a whole transaction from a Tensix core,
      and they are here as a **calibration target**: a per-hop NoC model plus a
      DRAM term plus the RISC-V issue path should reproduce them within
      whatever tolerance the estimator claims. That is the cheapest available
      end-to-end check short of silicon traces, and it is the check ROADMAP
      section I "Calibration against silicon traces" is asking for a substitute
      for. All eight are measured *cycle* counts, returned unscaled by the same
      function whose bandwidth branch applies a device frequency; no clock
      conversion is involved in any of them (the ``clock`` note chases this
      down, because the belief that one was is what kept Blackhole's DRAM
      latency a gap).

      One row is not understood: ``l1_local_cycles`` on Blackhole, 88. The
      other three Blackhole rows are mutually consistent with a 29-hop round
      trip at the docs' per-hop latency, and the local row is 54 cycles below
      where those three put it. Wormhole's four rows have no such disagreement
      (residuals 36 / 38 / 41). Named here rather than in ``access_latency``,
      which does not use this row.
  chip_level_bandwidth:
    wormhole_gb_per_s: 258
    blackhole_gb_per_s: 512
    provenance: vendor_source
    source: tm_operation_cpp#L28-41
    note: >
      "WH DRAM bandwidth: 258 GB/s = 21.5 GB/s * 6 channels * 2 banks. BH DRAM
      bandwidth: 512 GB/s (32GB GDDR6 @ 16 GT/sec)". The Wormhole figure is
      tt-metal's achievable number and is lower than the ISA docs' theoretical
      288 GB/s, which is consistent with the docs' own 92% caveat. The
      Blackhole figure is the only DRAM bandwidth number available for that
      arch at all -- BlackholeA0 has no DRAMTile directory in the ISA docs.

# ---------------------------------------------------------------------------
riscv:
  note: >
    ROADMAP section I asks for "fetch/issue/retire stages for RV". The ISA docs
    describe exactly those stages and give per-stage occupancies, so this
    section is almost entirely isa_doc -- which is a pleasant surprise, since
    the vendor trees have nothing whatsoever on baby-core instruction timing.

    Wormhole and Blackhole differ enough here to be worth reading separately:
    Wormhole has Frontend / Integer Unit / Load-Store / Retire, Blackhole has
    Frontend / EX1 / EX2 (/EX3 on T2) / Load-Store / Retire, which moves
    multiply out of the main integer stage and doubles the branch-mispredict
    bubble. Those live under ``arch_overrides``.
  issue:
    instructions_per_cycle: 1
    provenance: isa_doc
    source: wh_riscv
    note: >
      "relatively small 32-bit in-order single-issue cores ... intended to
      execute one RV32IM instruction per cycle". The Frontend "is capable of
      sending one instruction per cycle to the Integer Unit".
  pipeline:
    stages: [frontend, integer_unit, load_store_unit, retire_unit]
    min_cycles_per_stage: 1
    provenance: isa_doc
    source: wh_riscv#pipeline
    note: >
      "every instruction spends at least one cycle in the Integer Unit, at
      least one cycle in the Load/Store Unit, and at least one cycle in Retire
      Unit." The Retire Unit is "entirely invisible from an external
      perspective".
  integer_unit:
    default: 1
    alu_forwarding: true
    multiply: 2
    divide_by_zero_or_one: 2
    divide_int_min_by_minus_one: 2
    divide_general: { cycles: 6, max: 33, bound: range }
    branch: 1
    branch_mispredict_bubble: 2
    branch_mispredict_observed: 3
    provenance: isa_doc
    source: wh_riscv#integer-unit
    note: >
      "Multiply instructions (mul, mulh, mulhsu, mulhu) occupy the Integer Unit
      for two cycles, and the next instruction cannot enter the unit until the
      multiply instruction has finished." Divide is "between six and 33 cycles
      ... dependent upon the magnitude of the dividend", with the two-cycle
      special cases listed above. "A mispredicted branch causes a two cycle
      pipeline bubble, which from an external perspective looks like
      mispredicted branches occupy the Integer Unit for three cycles (plus
      additional cycles if the branch target is not in the instruction RAM or
      instruction cache)." The forwarding path means "integer operations (other
      than multiply and divide) appear to execute with latency 1 and throughput
      1".
  load_latency:
    core_local_data_ram: 2
    mailboxes_pcbufs_ttsync_semaphores: { cycles: 3, bound: at_least }
    tensix_gprs_and_backend_config: { cycles: 4, bound: at_least }
    tdma_tilectrl_pic_noc0_noc1_overlay: { cycles: 7, bound: at_least }
    l1: { cycles: 8, bound: at_least }
    minimum: 2
    max_loads_in_flight: 8
    max_loads_in_flight_mmio_group: 4
    provenance: isa_doc
    source: wh_riscv#loadstore-unit
    note: >
      Straight from the load-latency table. "A latency of N cycles means that
      N - 1 independent instructions need to follow the load if the latency is
      to be entirely hidden. The minimum possible load latency is two cycles."
      The ">= 4" and ">= 7" rows say "more in the case of access conflicts";
      the L1 row says "more in the case of access port conflicts or bank
      conflicts". The in-flight limits come from the same table's "Maximum
      loads in flight" column: 8 for local RAM, and one shared budget of "4 (in
      aggregate across all of these regions)" whose cell spans EVERY other row
      -- mailboxes/PCBufs/TTSync/semaphores, Tensix GPRs and backend config,
      the >= 7 group and L1 alike. (This note used to say the 4 covered only
      the mailbox group; it is a four-row rowspan, corrected 2026-08-06 while
      re-reading the table for the NIU row below.)

      THE IN-FLIGHT COLUMN IS STILL CONSUMED BY NOTHING, AND THAT IS NOW A
      DECISION RATHER THAN A GAP (2026-08-06). It is the same mechanism as
      ``load_throughput`` below, which IS consumed: four loads in flight
      sustaining "four such loads every N - 1 cycles" is a residency of
      exactly N - 1 (Little's law), so the two published statements are one
      queue described twice and charging both would bill it twice. Which of
      the two to spend is settled by arithmetic rather than taste -- for every
      row in this table the cap of 4 is unreachable except in the regime the
      formula already limits. A stream at one load per cycle with residency
      N - 1 has min(N - 1, 4) loads in flight, so the cap binds only when
      N >= 5, which is exactly the branch ``one_per_cycle_if_latency_under``
      switches the formula on at. The 8 for core-local data RAM is inert under
      either reading: at a latency of 2 that stream never has more than one
      load in flight. Blackhole's table does not repeat this column at all,
      which is a second reason the consumed number is the formula's own "four"
      and not this one.

      THE ">= 7" ROW'S KEY WAS RENAMED ON 2026-08-06 AND THAT RENAME IS THE
      WHOLE OF ROADMAP ITEM 2. It used to read ``tdma_tilectrl_pic_noc_overlay``
      and the trailing "noc_overlay" was read as one thing, so the NoC NIU
      register blocks at 0xFFB2_0000 / 0xFFB3_0000 -- which every
      ``noc_async_*_barrier`` in every dataflow kernel polls, the busiest MMIO
      load in the tree -- were recorded as having no row and charged nothing.
      The row's cell lists SIX entries, one per line, and two of them are "NoC
      0 configuration and command" and "NoC 1 configuration and command",
      linking to NoC/MemoryMap.md where the overlay's entry links to
      NoC/Overlay/README.md. So this is one number covering three distinct NoC
      blocks plus TDMA, tile control and the PIC, and the key now says so.
      Nothing about the number, its bound or its provenance changed.
  load_throughput:
    one_per_cycle_if_latency_under: 5
    else_loads_per_window: 4
    else_window_cycles_offset: -1
    provenance: isa_doc
    source: wh_riscv#loadstore-unit
    note: >
      "Throughput of sustained loads is one per cycle if the load latency is
      less than five cycles. Otherwise, when the load latency is N cycles, the
      throughput of sustained loads is four such loads every N - 1 cycles."
      ``else_window_cycles_offset`` is the "- 1" of that formula, kept as data
      rather than as a magic number in whatever consumes this.

      CONSUMED since 2026-08-06 by tt_sim/pe/rv/cost.py, in the shape the
      sentence has rather than as a rate: ``else_loads_per_window`` slots, each
      held for the region's N + ``else_window_cycles_offset`` cycles, and a
      load that finds no free slot stalls until one frees. On a stream of one
      latency that IS the sentence; on a stream of mixed latencies -- which
      the sentence does not cover and a real kernel always is -- it is the only
      reading that reduces to the sentence on every uniform stream. Rows below
      ``one_per_cycle_if_latency_under`` take no slot at all, because one load
      per cycle is what a single-issue core does anyway.

      This is the SAME queue as ``load_latency.max_loads_in_flight_mmio_group``
      and it is charged once, through this entry; see that note for the
      Little's-law argument and for why the cap is unreachable outside the
      regime this formula already limits.

      WHAT IT IS WORTH, MEASURED RATHER THAN ASSUMED: 4 to 9 charged stall
      cycles per in-tree replay guard, delivering 0 to 4 cycles to the totals.
      Nothing in the tree issues sustained independent loads -- every load's
      result is read within a few instructions, so the load-use interlock
      stalls the core long before four loads are in flight. The path that does
      hit it is tt-metal's own ``noc_local_state_init``, which pipelines five
      to ten NIU counter reads back to back to hide exactly this latency. The
      term is wired because it is published, sourced and corroborated, not
      because it moved a total.
  store_throughput:
    l1_period_cycles: 5
    other_regions_period_cycles: 1
    provenance: isa_doc
    source: wh_riscv#loadstore-unit
    note: >
      "Throughput of sustained stores to L1 is at most one store every five
      cycles. Other memory regions can achieve a throughput of one store every
      cycle." The L1 page explains why: RISCV stores are always narrow, and a
      narrow write is a read-modify-write that "blocks both the port and the
      underlying bank for five cycles".
  instruction_fetch:
    bits_per_l1_read: 128
    instructions_per_read: 4
    expected_period_cycles: 4
    provenance: isa_doc
    source: wh_l1#risc-v-cores
    note: >
      "RISCV instruction fetches into the instruction cache are always 128-bit
      reads against L1, though each read yields four instructions, so
      instruction fetches are expected to occur at most once every four cycles
      (and ideally much less frequently than this if the instruction cache hit
      rate is high)." Instruction *cache* miss cost is not published.
  ttinsn_fusion:
    max_fused: 4
    enqueue_per_thread_per_cycle: 4
    dequeue_per_thread_per_cycle: 1
    provenance: isa_doc
    source: bh_ttinsn
    note: >
      "sequences of up to four adjacent .ttinsn instructions can be fused
      together by the RISCV T0 / T1 / T2 instruction caches and executed in a
      single cycle (this allows four Tensix instructions to be queued up per
      thread per cycle, but the maximum dequeue rate is only one instruction
      per thread per cycle)." Relevant to the pump because it decouples the
      RISC-V core's rate from the Tensix backend's: the queue can outrun the
      backend 4:1 for short bursts. Stated on the Blackhole page; the Wormhole
      page describes the same .ttinsn extension without the fusion claim.

      THE NUMBERS ABOVE ARE UNCHANGED AND WILL STAY THAT WAY. Silicon now
      disagrees with two of the three, and the disagreement is recorded in
      ``contradiction`` below rather than resolved by editing the entry -- see
      "WHY THERE IS NO ``measured`` PROVENANCE" at the top of
      tensix_instruction_costs.yaml. Nothing consumes ``max_fused`` or
      ``enqueue_per_thread_per_cycle``, so no simulated cycle depends on which
      of the two is right; what depends on it is whether a future front-end
      model may assume a sub-cycle push, and the answer is no.
    corroboration: >
      ``dequeue_per_thread_per_cycle: 1`` MEASURED ON BLACKHOLE SILICON,
      2026-08-05, phase T of perfbench/riscvbench: sustained bursts of 64
      back-to-back ``.ttinsn`` words read 0.996 (TTI_NOP, unit NONE), 0.998
      (TTI_SFPNOP, SFPU) and 0.996 (TTI_SETDMAREG, ThCon) cycles per
      instruction from one issuing thread. One per thread per cycle, on three
      different backend units, is the drain rate read directly.

      The same probes at two and three issuing threads read 1.968/2.973 and
      1.964/2.972 for the SFPU and ThCon words while TTI_NOP -- whose unit is
      NONE -- stays flat at 0.996-0.998. That is the clean control: what scales
      is the shared backend, not the per-thread push path.

      TWO RUNS, ON ONE CARD, one operator, one power state, one day.
      tt_sim/perf/datasets/riscvbench-blackhole.csv is the primary
      (``--blocks 32``, phase T valid); riscvbench-blackhole-blocks8.csv is the
      companion whose own validity gate refused it and which agrees to within
      0.012 cycles on every figure above. BLACKHOLE ONLY -- Wormhole's page
      describes the same extension and nothing has measured it there.
    contradiction: >
      ``max_fused: 4`` AND ``enqueue_per_thread_per_cycle: 4`` ARE CONTRADICTED
      BY MEASUREMENT OF THE SAME QUANTITY. Blackhole silicon, 2026-08-05, phase
      T of perfbench/riscvbench. Two probes execute the identical twenty
      instructions -- sixteen ``addi`` plus four ``TTI_NOP`` -- and differ only
      in whether any two of the ``.ttinsn`` words are adjacent:

        tt_pad      16 addi                            15.929 cycles/group
        tt_fuse2     2 adjacent .ttinsn + 16 addi      17.901   (pad + 1.972)
        tt_fuse4     4 adjacent .ttinsn + 16 addi      19.889   (pad + 3.960)
        tt_spread4   4 .ttinsn, none adjacent, + 16    19.966   (pad + 4.037)

      ``spread4 - fuse4`` is +0.077 cycles per group where four-way fusion
      predicts +3.000. Every ``.ttinsn`` word costs its own issue slot, whether
      or not its neighbours are ``.ttinsn`` words. Reproduced in all six
      thread slots of the run (+0.077, -0.094, +0.002, +0.003, +0.002, +0.001)
      and in the companion ``--blocks 8`` run (+0.314 at one thread).

      THE "DIFFERENT QUANTITIES" ESCAPE WAS LOOKED FOR AND IS NOT THERE. That
      escape is what resolved the one previous document/silicon conflict in
      these tables (CFG.RDCFG, a documented latency against a measured
      occupancy), so it was checked before this was written down:

        * ADJACENCY SURVIVES THE COMPILER. Verified by disassembling the
          kernel this run executed, not assumed: the phase T ELF contains
          exactly 16 runs of four consecutive ``08000000`` (ttnop) words at
          four-byte stride, 16 runs of two, 64 singletons and one run of 64 --
          which is tt_fuse4, tt_fuse2, tt_spread4 and the sustained probe, with
          no instruction of any kind interposed.
        * IT IS NOT A FETCH-LINE STRADDLE. Fusion is attributed to the
          instruction caches, which read 128 bits (four instructions) at a
          time, so a run split across two reads might plausibly fuse less. All
          16 of tt_fuse4's runs do straddle -- they start at address 8 mod 16 --
          but that hypothesis predicts 2 fused slots and +2.000, not +0.077.
          And it is refuted outright by tt_fuse2, ALL of whose pairs are
          co-resident in a single 128-bit read (they start at 0 or 8 mod 16, so
          both words are always inside one line) and which still costs its full
          two cycles.
        * IT IS NOT THE DEQUEUE CAP MASKING IT. That cap is the reason a
          sustained burst cannot see fusion, and it is why these probes are
          groups rather than bursts: sixteen ``addi`` follow each group, which
          is sixteen cycles for a queue draining at one per cycle to swallow
          four pushes. Fusion would have shown.
        * THE MEASURED QUANTITY IS THE DOCUMENTED ONE. The page distinguishes
          enqueue (four per cycle, via fusion) from dequeue (one per cycle),
          and what these probes time is the ISSUING CORE, i.e. the enqueue
          side. The entry's other field, dequeue, is corroborated above.

      WHAT IS STILL OPEN, honestly. The doc attributes fusion to the
      instruction CACHES; a core executing from local instruction RAM instead
      would bypass that path. tt-metal built these kernels for execute-in-place
      out of L1 (the cache carries a ``.xip.elf``), which is the cache path, but
      that has not been confirmed at the hardware level. A Wormhole run would
      settle nothing here either way: the fusion sentence is on the Blackhole
      page only.

      TWO RUNS, ON ONE CARD, one operator, one power state, one day; the
      primary is tt_sim/perf/datasets/riscvbench-blackhole.csv with phase T
      valid. This field records a disagreement; it does not resolve one, and it
      changes neither a number above nor the provenance rank. See
      docs/plans/riscv-front-end-benchmark.md and docs/bh_arch.md.

# ---------------------------------------------------------------------------
mover:
  note: >
    Unusually, the Mover's numbers are published as *measured* rather than
    theoretical, and with both an ideal and a contended column. That is more
    honest than most of the table and is reproduced as-is. Neither ttsim (whose
    XMOV is an instantaneous memcpy) nor tt-metal has anything on the Mover, so
    the ISA doc is the only source. CONSUMED since 2026-08-06 by MoverCostModel
    (tt_sim/perf/model.py): a transfer holds the mover unit for
    ceil(bytes * 8 * per_cycles / moved_bits) cycles at the IDEAL column --
    charging the contended column would need a sourced rule for when
    contention applies, which the page does not give, so the ideal rate is the
    floor and the contended column is recorded, unconsumed.
  issue:
    occupancy: 1
    provenance: isa_doc
    source: wh_mover
    note: >
      See units.XMOV in tensix_instruction_costs.yaml -- the issuing thread
      stalls until the mover can start, then XMOV itself is a single cycle and
      the transfer proceeds in the background.
  transfer:
    l1_to_l1:
      ideal: { reads: 8, writes: 8, bits_each: 128, per_cycles: 11, bits_per_cycle: 93.1 }
      contended: { reads: 1, writes: 1, bits_each: 128, per_cycles: 4, bits_per_cycle: 32 }
      provenance: isa_doc
      source: wh_mover#performance
      note: >
        Covers XMOV_L1_TO_L1 and XMOV_L1_TO_L0 (memcpy). "Eight 128b reads and
        eight 128b writes every 11 cycles i.e. 93.1 bits copied per cycle"
        ideally; "One 128b read and one 128b write every four cycles i.e. 32
        bits copied per cycle" with some L1 access port contention. The L1 page
        restates the ideal figure independently.
    l1_memset:
      ideal: { writes: 1, bits_each: 128, per_cycles: 1, bits_per_cycle: 128 }
      contended: { writes: 1, bits_each: 128, per_cycles: 3, bits_per_cycle: 42.7 }
      provenance: isa_doc
      source: wh_mover#performance
      note: XMOV_L0_TO_L1.
    non_l1_memset:
      ideal: { writes: 1, bits_each: 128, per_cycles: 1, bits_per_cycle: 128 }
      contended: { writes: 1, bits_each: 128, per_cycles: 1, bits_per_cycle: 128 }
      provenance: isa_doc
      source: wh_mover#performance
      note: XMOV_L0_TO_L0; does not touch L1, so contention does not apply.

# ---------------------------------------------------------------------------
l1:
  note: >
    Not a unit ROADMAP section I names, but it is where several of the units
    above actually serialise -- the unpacker, the packers, the mover, the NoC
    and the RISC-V cores all contend for the same 16 access ports -- so the
    bank model is recorded here rather than duplicated into each of them.
  banks: 16
  bank_size_kib: 91.5
  access_ports: 16
  bits_per_bank_access: 128
  accesses_per_bank_per_cycle: 1
  narrow_write_block_cycles: 5
  atomic_block_cycles: 5
  non_atomic_accumulate_block_cycles: 2
  provenance: isa_doc
  source: wh_l1
  note: >
    "L1 is organized as 16 banks of 91.5 KiB, with each bank capable of one
    128-bit read or one 128-bit write per cycle. Access to these banks is
    arbitrated through 16 access ports; any port can access any bank, but a
    bank conflict will occur if multiple ports try to access the same bank on
    the same cycle - all but one of the ports will be forced to wait." Narrow
    writes, unconditional atomics and conditional atomics are each a
    read-modify-write which "blocks both the port and the underlying bank for
    five cycles"; near-memory accumulate can instead be non-atomic and then
    "only blocks the port and bank for two out of those five cycles".
  thcon_l1_access:
    min_request_period_cycles: 3
    provenance: isa_doc
    source: wh_l1#tensix-scalar-unit
    note: >
      "Due to limitations of the scalar unit, it can only issue one memory
      request every three cycles ... 32-bit writes by the scalar unit have a
      peak bandwidth of one 32-bit write every five cycles, so 128-bit writes
      are preferred where possible (peak bandwidth one 128-bit write every
      three cycles)."

# ---------------------------------------------------------------------------
# Per-architecture differences. Deep-merged over the sections above; see the
# rationale in tensix_instruction_costs.yaml.
arch_overrides:
  wormhole:
    dram:
      access_latency:
        cycles: 99
        bound: at_least
        provenance: vendor_source_derived
        source: tm_dm_common#L200-216
        derivation: >
          access_latency = end_to_end_reference.dram_cycles
                         - end_to_end_reference.l1_remote_read_cycles
                         = 358 - 259 = 99 cycles (Wormhole).

          Both inputs are tt-metal's measured "initial latency" for the *same*
          transaction shape issued by the *same* agent: a remote read from a
          Tensix core. Everything the two have in common therefore cancels --
          the issuing core's own path, the NoC round trip, the response
          handling -- and what is left is the difference between what a DRAM
          endpoint costs to service and what an L1 endpoint costs to service.
          Note what this does NOT require: it never touches the hop model, so
          it cannot double-count the NoC term the way plugging in the raw 358
          would.

          The subtraction assumes the two figures were measured at the same NoC
          geometry. On Wormhole that is close to free: a round trip between two
          tiles differing on both axes is exactly grid_x + grid_y = 22 hops
          *whatever* the distance between them (each NoC is a directional
          torus), so two remote measurements cannot differ by hop count unless
          one of them shares an axis with its initiator.

          Cross-check, from the other direction and using the hop model:
          358 - 218 (modelled 22-hop round trip) = 140, minus the ~38-cycle
          issuing-core path that the three L1 rows agree on (36 / 38 / 41)
          = ~102. Two derivations that share only their source data agree to
          3 cycles. The residual gap is consistent with an L1 endpoint's own
          service time being a handful of cycles, which is what l1's bank
          model implies and what this entry folds out.

          A third route, added 2026-08-03 when the same subtraction was made
          to work on Blackhole: tt-metal's 740-entry tm_noc_latencies set is a
          different measurement campaign by the same test suite, and its
          DRAM_SHARDED-minus-L1 difference for one 64 B ONE_FROM_ONE read is
          397 - 293 = 104, with 104 / 104 / 104 / 112 / 104 / 112 over
          64 B..2 KiB. 99, ~102 and 104-107, from three routes sharing only a
          vendor.
        note: >
          **A difference, charged as a latency, and that is the honest reading
          of it.** 99 is (DRAM service) - (L1 service), and tt-sim charges an
          L1 endpoint nothing, so charging 99 at the DRAM endpoint reproduces
          the measured DRAM-vs-L1 difference exactly while remaining a *floor*
          on the absolute device latency -- hence ``bound: at_least``. The
          bound comes from the derivation, not from a qualifier anybody
          printed.

          What is modelled: a flat per-request service time at the DRAM
          endpoint, paid once, on every read, write and atomic that arrives
          over the NoC.

          What is NOT modelled, and none of it is folded into this number:
          bank conflicts and refresh windows (ROADMAP section I names both;
          no source quantifies either, and tt-sim has no bank model for DRAM
          at all), read/write turnaround, and the *device's* own occupancy --
          how long the array is unavailable to a second request. This 99 is a
          latency; no source publishes the re-issue interval or the pipelining
          depth behind it, and reading one as the other would assert a
          throughput of one request per 99 cycles, which is 0.3 B/cycle
          against a channel the same page publishes at 24. So the endpoint's
          queue stops at the *channel*, which ``channel_serialisation`` sizes
          and which since 2026-08-09 a second request does wait for. Nor is
          transfer time folded in here: a 32-byte poke and an 8 KiB burst are
          charged the same 99.

          **This note used to end by arguing that size dependence therefore
          belonged nowhere near DRAM, and that argument was wrong.** It read:
          size dependence is a bandwidth term, it is the *same physical
          serialisation* ``noc.flit_bits`` already charges a packet on the
          wire, so charging it here as well would bill one queue twice --
          hence ``dram.bandwidth`` stayed deliberately unconsumed. The NoC
          link and the GDDR6 channel are not one queue. They are two, in
          series, at two different rates (32 B/cycle against 24), and a
          transfer streaming through both runs at the slower. Rung 2's sweep
          measured a Wormhole DRAM read sustaining 24.38 B/cycle against a
          modelled 32, and 24.38 is not a fraction of 32 -- it is
          ``bandwidth.per_channel_gb_per_s`` to within 2%. The double-billing
          the old argument feared is real only if the two times are *added*;
          ``channel_serialisation`` above charges the excess of one over the
          other, so they are not. The size term now lives in
          ``dram.channel_serialisation`` and this entry stays exactly what it
          was: a flat per-request device latency.

          **NOT SPLIT BY ACTION, and Blackhole is.** 99 is charged to a read, a
          write and an atomic alike here, and that is a decision rather than an
          omission. Blackhole gained a separate DRAM *write* figure on
          2026-08-17 (``arch_overrides.blackhole.dram.access_latency.write``,
          22 cycles), derived by subtracting tm_noc_latencies' L1 row from its
          DRAM_SHARDED row in the ONE_TO_ONE direction. Doing the identical
          subtraction on Wormhole's rows gives write differences of
          228 / 124 / 127 / 139 / 139 / 145 / 137 / 155 over 64 B..8 KiB,
          against read differences of 104 / 104 / 104 / 112 / 104 / 112 / 128 /
          152. That is not the same finding at all: no clean asymmetry, a
          visible 64 B outlier, and a write that is if anything DEARER than a
          read -- so there is no direction here to charge less, and inventing
          one from Blackhole's rows would be laundering one part's measurement
          into another's. This entry therefore stays one number for all three
          request actions until Wormhole's own data says otherwise.
  blackhole:
    noc:
      flit_bits: 512
      provenance: isa_doc
      source: bh_noc#performance
      note: >
        The hop *latencies* are unchanged from Wormhole (~5 / 9 / ~5); only the
        flit doubles, from 256 to 512 bits, matching ArchProfile's
        noc_max_burst_size going 8 KiB -> 16 KiB. No per-hop link bandwidth in
        GB/s is published for Blackhole, so ``link_bandwidth_gb_per_s`` is not
        overridden and must not be read as a Blackhole figure.
      corroboration: >
        ``flit_bits: 512`` at ``throughput_flits_per_cycle: 1`` is 64 bytes per
        cycle per link, and that number MEASURED ON BLACKHOLE SILICON,
        2026-08-05, by perfbench/nocbench -- twice, off two different
        resources, in units the table never sees.

        (1) The injecting NIU's own link. One flow of 64 x N bytes to a fixed
        subordinate costs 39.9 / 39.8 / 40.2 / 72.2 / 137.8 / 268.4 cycles per
        transaction at N = 64 / 512 / 2048 / 4096 / 8192 / 16384. Above the
        ~40-cycle issue loop the cost IS the occupancy: 16384 / 64 = 256
        against 268.4 measured, 8192 / 64 = 128 against 137.8.

        (2) A router-to-router link, which the model charges nothing for. Two
        flows whose payloads cross exactly ONE common link each pay one extra
        occupancy: the 0-shared to 1-shared delta is 28.1 / 63.1 / 124.5 /
        250.4 cycles at 2048 / 4096 / 8192 / 16384 bytes, against occupancies
        of 32 / 64 / 128 / 256 -- a ratio of 0.88, 0.99, 0.97, 0.98. At 64 and
        512 bytes the delta is zero, because a packet that holds the link for
        1 or 8 cycles out of ~40 does not queue. BOTH READINGS ARE NOW
        CONSUMED, as of 2026-08-05, and neither of them as a number: the
        second one is the same ``throughput_flits_per_cycle`` as the first,
        spent on each router-to-router link instead of only at the injecting
        NIU. See ``noc.congestion``, and note that this stays a CORROBORATION
        rather than becoming an entry -- what the card confirmed is where an
        ``isa_doc`` figure belongs, not what it is.

        TWO RUNS, ON ONE CARD, one operator, one day, and they are not
        averaged: tt_sim/perf/datasets/nocbench-blackhole.csv is the run with
        the controls in it (87 flows, `size` and `readport` both PASS,
        `readport` 1.92x) and nocbench-blackhole-sizes.csv is a separate 96-flow
        sweep that carries none. The two share two of twelve cells and agree to
        0.8 cycles/tx. BLACKHOLE ONLY -- the same experiment has never been run
        on Wormhole, where the flit is half as wide and the arithmetic would be
        a different one.
      link_bandwidth_gb_per_s:
        provenance: unknown
        note: not published for Blackhole; the Wormhole 32 GB/s does not carry over.
    dram:
      access_latency:
        cycles: 126
        bound: at_least
        provenance: vendor_source_derived
        source: tm_dm_common#L200-216
        derivation: >
          access_latency = end_to_end_reference.dram_cycles
                         - end_to_end_reference.l1_remote_read_cycles
                         = 529 - 403 = 126 cycles (Blackhole).

          The same subtraction as Wormhole's, on the same table, for the same
          reason: both inputs are tt-metal's measured "initial latency" for the
          same transaction shape issued by the same agent, so the issuing
          core's path, the NoC round trip and the response handling cancel and
          what is left is (DRAM endpoint service) - (L1 endpoint service). No
          modelled quantity appears in it.

          The geometry assumption is the same and is just as cheap: a round
          trip between two tiles differing on both axes is exactly
          noc_grid_x + noc_grid_y = 29 hops *whatever* the distance between
          them, so two remote measurements cannot differ by hop count unless
          one shares an axis with its initiator.

          Cross-check, from a second and independent vendor dataset. tt-metal's
          740-entry tm_noc_latencies set was collected by the same test suite
          but a different campaign, and it carries L1 and DRAM_SHARDED rows for
          the *same* pattern (ONE_FROM_ONE read), transaction count (1) and
          axis relationship, per transaction size. Subtracting those:

            Blackhole  481 - 373 = 108 at 64 B; over the six sizes 64 B..2 KiB
                       where the comparison is still latency-dominated, the
                       differences are 108 / 88 / 128 / 127 / 152 / 124,
                       mean 121.
            Wormhole   397 - 293 = 104 at 64 B; the same six are
                       104 / 104 / 104 / 112 / 104 / 112, mean 107.

          So the second dataset says 121 where this entry says 126 (-4%), and
          107 where the Wormhole entry says 99 (+8%). Two campaigns that share
          only a test suite agree on both arches at the same level, which is
          the same standard the Wormhole entry's two routes were held to.

          The shipped number is tm_dm_common's, not tm_noc_latencies', so that
          the two arches' figures are the *same* arithmetic on the *same* four
          constants and remain commensurate with each other. Blackhole's
          scatter is the larger: its L1 row is non-monotonic in transaction
          size by up to 21 cycles where Wormhole's is flat, so 126 is a
          coarser number than 99 even though both are one subtraction.
        note: >
          Everything the Wormhole entry's note says about what this is and is
          not applies unchanged: it is a difference charged as a latency, hence
          ``bound: at_least``; and it models no bank conflicts, no refresh
          window, no endpoint occupancy and no size dependence.

          One difference worth naming rather than inheriting, and since
          2026-08-17 it is modelled rather than only recorded. Blackhole's
          measured rows say a *write* to DRAM costs far less over L1 than a
          read does: in tm_noc_latencies at one transaction the DRAM-minus-L1
          difference is ~13-29 cycles for ONE_TO_ONE against ~88-155 for
          ONE_FROM_ONE. That asymmetry is physically unsurprising -- a write is
          answered when it is accepted, a read when the array has been read --
          and this entry used to charge one number to all three request
          actions, so a Blackhole DRAM write was over-charged by ~104 cycles
          relative to that measurement. ``write`` below is that direction's own
          figure, by the same subtraction on the same file; **126 is the READ
          figure and is unchanged.** Wormhole's rows still do not show the
          asymmetry cleanly enough to model it, so this stays a per-arch shape
          change and both arches' notes say so.
        write:
          cycles: 22
          bound: at_least
          provenance: vendor_source_derived
          source: tm_noc_latencies
          derivation: >
            The same DRAM-minus-L1 subtraction as the read figure above, in the
            other direction. tm_noc_latencies, Blackhole, UNICAST ONE_TO_ONE (a
            write), one transaction per barrier, one subordinate, different
            axis, DRAM_SHARDED minus L1, over the eight sizes the DRAM sweep
            actually issues (above 8 KiB the file is padded fill rather than
            measurement -- see ``point_is_measured``):

              bytes     64  128  256  512 1024 2048 4096 8192
              DRAM     380  388  388  391  396  422  454  523
              L1       358  359  360  369  375  403  432  510
              -----------------------------------------------
              diff      22   29   28   22   21   19   22   13

            mean 22.0, median 22, flat across seven doublings -- so 22 cycles,
            size-independent, which is what a flat per-request service time
            looks like. One subtraction per column and one mean, on cycle
            counts read straight off the vendor file; no modelled quantity and
            no fitted coefficient enters it.

            WHY THIS ENTRY CITES A DIFFERENT CAMPAIGN FROM THE READ FIGURE, and
            why the two are still commensurable. tm_dm_common publishes one
            DRAM row and it is a *read*, so there is no write figure to
            subtract there; the write direction exists only in
            tm_noc_latencies. The two campaigns are therefore checked against
            each other in the direction they share: the same subtraction on the
            same rows for ONE_FROM_ONE gives 108 / 88 / 128 / 127 / 152 / 124 /
            139 / 155, mean 127.6, against the 126 the read figure ships from
            tm_dm_common -- 1.3 %. And scaling that shipped read figure by this
            campaign's own write-to-read ratio, 126 * 22.0 / 127.6 = 21.7,
            returns the same 22 to within half a cycle. So the split does not
            depend on which of the two campaigns is treated as the anchor.
          note: >
            BLACKHOLE ONLY, and the reason is in the data rather than in the
            physics. A write is answered when the endpoint accepts it and a
            read when the array has been read, so an asymmetry is expected on
            both chips -- but Wormhole's rows do not show one that can be
            modelled. The same subtraction there gives write differences of
            228 / 124 / 127 / 139 / 139 / 145 / 137 / 155 against read
            differences of 104 / 104 / 104 / 112 / 104 / 112 / 128 / 152: no
            clean asymmetry, a visible 64 B outlier, and if anything a *dearer*
            write. So Wormhole keeps one figure for all three request actions
            and its own entry says so. A per-arch shape change resting on one
            arch's data is acceptable only where it says so, and this is where.

            What is charged, and to what. ``DramCostModel.service_cycles_for``
            picks this figure for a WRITE and the read figure for a READ; an
            ATOMIC takes the read figure, because it reads the array before it
            modifies it. The channel term is untouched and was already per
            direction (``channel_serialisation`` derives a Blackhole read rate
            and declines a write one), so a Blackhole DRAM write is now charged
            22 flat cycles and nothing else.

            Same shape as the read figure and the same caveats: a difference
            charged as a latency, hence ``bound: at_least``; no bank conflicts,
            no refresh window, no device occupancy, no size dependence.

            One thing this closes. While the read-derived 126 was charged to
            writes as well, ``tt_sim/perf/noc_dataset_sweep_test.py`` pinned
            that row as the assembled model's single ``KNOWN_OVER_CHARGED``
            entry -- the one place the assembled model predicted a transfer
            costing *more* than tt-metal measured it, by 37 to 52 cycles over
            64 B..8 KiB. That set is now empty, every prediction on that row
            having fallen by exactly 104, and the assertion that it stays empty
            is still in place.

            CORROBORATION, WHICH IS NOT PROVENANCE. A Blackhole p150 session
            (``perfbench/card-sessions/2026-08-17-nocfixed/``: three arms, two
            sizes, three repeats, all 18 runs passing every instrument gate)
            measured the over-charge this removes at +97 cycles at 256 B and
            +89 at 4096 B, against the 126 - 22 = 104 predicted here, and its
            NoC-swap and peer-L1 arms showed the error following the *write*
            rather than the NoC and vanishing when DRAM leaves the path
            entirely. Not one number above is fitted to it, and nothing
            measured by ``perfbench`` may enter this file as a source.
      bandwidth:
        provenance: unknown
        note: >
          BlackholeA0 has no DRAMTile directory in the ISA docs, so there is no
          per-channel figure, no GT/s and no achievable fraction. The chip has
          24 DRAM tiles exposing 32 GiB of GDDR6 (BlackholeA0/README.md), and
          tt-metal quotes 512 GB/s chip-level -- see ``chip_level_bandwidth``,
          which is vendor_source and applies to both arches.

          THIS NO LONGER GATES ANYTHING, and the record of why it was thought
          to is worth keeping. Until 2026-08-12 both the size term and the
          endpoint-occupancy term were held off Blackhole on the ground that
          ``channel_serialisation`` "follows ``bandwidth`` straight down" --
          with no published GB/s there is nothing to convert. That is true of
          *this* entry and was mistaken as a rule about the arch: a bytes-per-
          cycle figure does not have to arrive by unit conversion from a GB/s,
          and on Blackhole it arrives instead by arithmetic on two of
          tt-metal's own measured cycle counts. See ``channel_serialisation``
          below. What stays ``unknown`` here is what genuinely needs the
          document: a per-*channel* rate in GB/s, how many channels a tile
          fronts, and the achievable fraction. None of those three is a thing
          the derivation below produces, and none of them is consumed.
      channel_serialisation:
        bytes_per_cycle_read: 47.0805
        provenance: vendor_source_derived
        source: tm_noc_latencies
        derivation: >
          bytes_per_cycle_read = (8192 - 4096) / (665 - 578)
                               = 4096 / 87
                               = 47.08046 bytes per cycle,

          rounded to 47.0805 -- *up*, so the charge lands at its low end.

          Both cycle counts are vendor measurements read straight off
          ``tm_noc_latencies``: the DRAM_SHARDED, ONE_FROM_ONE, different-axis,
          one-transaction-per-barrier Blackhole row, at its 4096 B and 8192 B
          columns. Nothing else enters -- no modelled quantity, no fitted
          coefficient, no silicon of this project's own. It is one subtraction
          and one division, which is the same shape as ``access_latency``'s one
          subtraction and lands at the same rank.

          Why a difference of two sizes rather than a rate read off one. A
          transfer's measured time is (everything constant) + (bytes / rate),
          so differencing two sizes on the *same* row cancels the round trip,
          the endpoint's flat service time, the issuing core's path and the
          profiler's own instrumentation, exactly as ``access_latency``'s
          subtraction cancels the round trip. What is left is the slowest
          per-byte stage on the path. 8192 B is the largest measured DRAM
          column -- ``dram_accessor_sweep`` never issues a larger one and
          ``data_extractor.cpp`` pads the rest -- so these are the only two
          points there are, and the two-point secant is the whole fit.

          THE DERIVATION IS NOT NEW AND WAS NOT ADJUSTED TO REACH THIS NUMBER.
          It is what ``tt_sim.perf.noc_dataset_sweep`` has printed under
          "implied sustained bandwidth, from the large-transfer slope" since
          2026-08-08, unchanged, for every series on both arches at once.

          WHAT MAKES IT A RATE RATHER THAN A RESIDUAL: the same arithmetic on
          the same file, run on the *Wormhole* rows, returns 24.38 B/cycle for
          reads (4096 / (733 - 565)) and 24.53 for writes (4096 / (768 - 601))
          -- against a per-channel figure of 24 that WormholeB0's DRAM tile
          page publishes and that this file has carried at ``isa_doc`` since
          long before the dataset was read. The derivation recovers a published
          number it was never given, to +1.6% and +2.2%, on the one
          architecture where a published number exists to recover. That is the
          control, and it is what says the slope reads a *bottleneck rate*
          rather than an accumulation: an additive two-stage model would need
          Wormhole's channel to be 102 B/cycle to produce a 24.38 end-to-end
          against a 32 B/cycle link, which is four times the published figure
          and is refused by the same arithmetic that accepts the other reading.

          The 47.08 is therefore the rate of the slowest stage a Blackhole DRAM
          read crosses, and it is not the NoC link: the same file's L1 rows,
          which cross the link and no DRAM, slope at 60.35 / 60.59 / 60.89 /
          60.83 B/cycle on this arch. 47.08 sits 22% below all four. Something
          at the DRAM endpoint is slower than the fabric, by a margin the
          fabric's own rows bound.
        note: >
          CONSUMED ON TWO AXES, AND ON THIS ARCH THEY ARE NOT THE SAME SET OF
          DIRECTIONS. Charged exactly as Wormhole's is: as the *excess* over
          the link's own serialisation
          (``DramCostModel.channel_excess_cycles``), so a transfer's
          size-dependent cost is ``ceil(N / 47.0805)`` once and not added to
          the link's, and as the channel's *occupancy* (``DramChannels``), so a
          request arriving while the channel is streaming waits. One figure on
          two axes, as on Wormhole -- but here the latency axis is charged to
          READS ONLY and the occupancy axis to both, which is the whole content
          of the two paragraphs below and of ``write_occupancy``.

          THE DEEP MERGE IS STILL THE HAZARD IT ALWAYS WAS. Wormhole's
          ``bytes_per_cycle: 24`` remains physically present under this key on
          Blackhole, and the consumer must not read it: a directional key here
          *replaces* the merged flat one rather than falling back to it, so
          Blackhole's read rate is its own and its write rate is nothing at
          all. ``costs_test.test_the_dram_channel_rate_is_exactly_its_own_
          derivation`` asserts both halves.

          THE WRITE DIRECTION IS NOT CHARGED AS A LATENCY, and it is the one
          thing this entry deliberately leaves on the floor. The same secant on
          the same arch's DRAM write row gives 4096 / (523 - 454) = 59.36
          B/cycle, and it is not separable from the fabric: this arch's four L1
          slopes are 60.35 / 60.59 / 60.89 / 60.83, and 59.36 is within 2.5% of
          all of them -- so a Blackhole DRAM write's *measured completion time*
          grows at the rate an L1 write's does, and the dataset resolves no
          endpoint-specific limit in it. Wormhole separates cleanly (DRAM write
          24.53 against L1 write 30.16, 19% apart), which is what a resolved
          bound looks like and what the read direction looks like here.

          So the 26% read/write gap is honoured by charging one direction and
          refusing the other, never by averaging the two into a single channel
          latency. What explains the gap is already recorded next door, in
          ``access_latency``'s note: "a write is answered when it is accepted,
          a read when the array has been read". A write's measured time does
          not contain the array, so its slope cannot measure the array.

          THE SECOND REASON THIS ENTRY USED TO GIVE IS VOID SINCE 2026-08-17
          and is recorded rather than deleted, because it was load-bearing. It
          read: "it would deepen a named over-charge -- ``access_latency`` is
          derived from the read figures and is already too large for a
          Blackhole write, the one row in ``KNOWN_OVER_CHARGED``, whose
          residuals run -37 to -52; adding a write channel term takes them to
          -45 to -54." ``access_latency.write`` landed that day and emptied
          that set; the row's residuals are now +52 to +67. The argument that
          survives is the one above, and it is about the latency axis alone.

          WHICH IS NOT THE SAME AS "NO WRITE RATE", and reading it that way is
          what left ``DramChannels.write_bytes_per_cycle`` at ``None`` on this
          arch. This figure is spent on two axes (see the first paragraph of
          this note) and the refusal above only reaches one of them. See
          ``write_occupancy`` below, which charges the other.

          WHAT THIS COSTS IN INDEPENDENCE, stated because it is the real price.
          Rung 2 validates the model against this dataset, and this entry now
          comes *from* it, so the Blackhole DRAM read row's large-transfer
          residual is no longer an independent check of the size term -- it is
          the term's own source, and its flattening (5.63 cycles/KiB to 0.55)
          is an identity rather than evidence. Two checks survive that and are
          named so a reader does not have to find them: the Wormhole control in
          the derivation above, which recovers an ``isa_doc`` number the
          arithmetic was never shown, and the DRAM *small* sizes on this arch,
          where no bandwidth term is in play and the residual is untouched.

          NOT FOLDED IN, exactly as on Wormhole: the device's own re-issue
          interval, bank conflicts, refresh windows, read/write turnaround.
          And this is a rate at *one* DRAM endpoint as tt-metal addresses it,
          not a per-GDDR6-channel figure -- ``bandwidth`` above stays
          ``unknown`` because a GB/s, a channel count and an achievable
          fraction are three things this arithmetic does not produce.
        write_occupancy:
          bytes_per_cycle: 47.0805
          provenance: vendor_source_derived
          source: tm_noc_latencies
          derivation: >
            The read rate above, to the digit, spent on the OCCUPANCY axis in
            the write direction:

              bytes_per_cycle = (8192 - 4096) / (665 - 578)
                              = 47.08046 bytes per cycle,

            rounded up to 47.0805 exactly as above, so the charge lands at its
            low end. There is no second measurement and no second arithmetic
            here -- one channel, one rate, and the working is the one already
            written out for the read direction.

            THE ONE EXTRA STEP, stated separately so it can be argued with: a
            channel's data bus is taken to move bytes at the same rate each
            way. That is not this project's assertion. It is what the only DRAM
            tile page either architecture publishes says in the sentence the
            base entry converts -- ``wh_dram#performance``: "each GDDR6 channel
            is theoretically capable of reading at 24 GB/s **or writing at 24
            GB/s**" -- one figure covering both directions, which is why the
            base entry's 24 is charged both ways without anyone calling it an
            extrapolation. Both parts front the same memory technology
            (``BlackholeA0/README.md``: "24 DRAM tiles" exposing 32 GiB of
            GDDR6), so what crosses architectures here is the *symmetry* of a
            GDDR6 data bus and nothing else. The LEVEL is Blackhole's own and
            deliberately is not carried: Wormhole's 24 stays out, which is the
            hazard the note below and ``costs_test`` both guard.
          note: >
            THE OCCUPANCY AXIS ONLY. The latency axis stays refused, for the
            reason the read entry's note gives at length: the same file's DRAM
            *write* row slopes at 59.36 B/cycle, within 2.5% of the same arch's
            four L1 rows, so a Blackhole DRAM write's measured completion time
            does not contain the channel drain and charging one to it would
            predict a steeper size dependence than the vendor measured. Rung 2
            says the same thing in residuals: that row runs +52 / +60 / +52 /
            +55 / +52 / +62 / +62 / +67 over 64 B..8 KiB today, a slope of
            +1.70 cycles/KiB, and adding the excess would take it to +51 / +59
            / +50 / +52 / +46 / +50 / +39 / +21 -- still a floor, but a row
            that now over-slopes by more than it currently under-slopes. That
            is a measurement refusing a term, and it is left refused.

            WHY THE SAME FILE CANNOT REFUSE THIS ONE. Every DRAM row in
            ``tm_noc_latencies`` is one transaction per barrier, and a lone
            request never finds the channel busy, so endpoint occupancy is
            invisible to every point in it -- in either direction. The absence
            of a write figure here was therefore never a measurement about
            writes; it was the latency axis's refusal, above, being read one
            axis too far. What it produced is visible and is not a model of
            anything: with ``DramChannels.write_bytes_per_cycle`` at ``None``
            every write claim was a no-op, so the write arm was unqueued and
            ran up against the DRAM tile's 64 B/cycle NoC link instead. Four
            tiles concentrated on one endpoint, 4096 B transactions, predicted
            60.32 B/cycle writing against 44.36 reading -- a Blackhole DRAM
            write 36% *faster* than a read, for no reason but the absence, and
            at a level set by a link rather than by an endpoint. With the
            figure below the same four tiles predict 45.00 against the same
            44.36, a ratio of 1.014.

            WHY THIS IS A FLOOR AND NOT AN INVENTION, which is the test every
            term in this file has to pass. The bytes have to cross the bus.
            Whatever buffering makes a write's acknowledgement early -- and the
            59.36 above is the evidence that something does -- a sustained
            write stream still cannot leave the channel faster than the channel
            moves bytes, so ``ceil(N / 47.0805)`` is the shortest the channel
            can possibly be busy on their account. Same argument as the base
            entry's, in the same direction: charged at the low end, and inert
            for an isolated request (``claim`` answers 0 on an idle channel),
            so no single-transfer prediction moves and rung 2's rows are
            untouched by construction. They are: every residual above is
            unchanged by this entry.

            NOT A NEW RANK AND NOT A NEW NUMBER. This is the fifth
            ``vendor_source_derived`` entry and the second nested one, for the
            same reason ``access_latency.write`` is nested: it is its own claim
            with its own working, and a write figure hanging silently off a
            read figure's provenance is what that convention exists to prevent.
            Unlike that one it cites the same campaign and the same two cycle
            counts as its parent, because it *is* its parent's number -- what
            it adds is the axis and the symmetry argument, both of which are
            above.

            CORROBORATION, WHICH IS NOT PROVENANCE, and on this entry the
            distinction is load-bearing rather than ceremonial: nothing below
            supplied a digit of the figure above, which was derived on
            2026-08-12 and never saw a card. A Blackhole p150 session
            (``2026-08-17``, dramratebench ``--dir both``, 120 participants
            concentrated on one endpoint, two independent runs agreeing to
            0.3%, 0 witness failures and 0 stray writes) measured read 47.159
            B/cycle against write 46.815 -- a write/read ratio of 0.993. Two
            readings, and only the second one licenses anything here: the
            plateau LEVEL sits 0.17% from the 47.0805 derived above, which is
            an independent check on a hand-derived two-point secant that had
            never been compared to silicon; and the two DIRECTIONS measure
            equal, which is what says the symmetry step in the derivation is
            not merely inherited from the other part's page. Neither is a
            source. Had the card disagreed, the entry that would have had to
            change is this note and not the number.

            For the record, and still not as a source: the modelled ratio with
            this term in place is 1.014 at four concentrated tiles against the
            card's 0.993, so the model now puts a Blackhole DRAM write within
            2% of its read where it used to put it 36% ahead. The residual 2%
            is a transient rather than a rate -- a write's flat service time is
            22 cycles against a read's 126, so at sixteen transactions per
            participant the write arm fills its pipeline sooner and the
            aggregate has not yet reached the plateau both directions share.
            Driven to saturation the two are equal by construction, which is
            what one rate on one channel means.

            NOT FOLDED IN, and the list is the parent's unchanged: the device's
            own re-issue interval, bank conflicts, refresh windows, read/write
            turnaround. Turnaround is the pointed one here -- a real GDDR6 bus
            costs something to reverse, so a mixed read/write stream is
            under-charged by this term in exactly the way it was before.
    riscv:
      # Every `corroboration` in this block is one silicon campaign:
      # perfbench/riscvbench on a Blackhole card, 2026-08-05, banked as
      # tt_sim/perf/datasets/riscvbench-blackhole.csv (--blocks 32, phases R,
      # T, C and F valid, Q refused) with riscvbench-blackhole-blocks8.csv as
      # the companion. They live under `arch_overrides.blackhole` rather than
      # in the base section for the obvious reason: a Blackhole measurement is
      # not evidence about Wormhole, and the base section is what Wormhole
      # reads. Several of these rows differ between the two architectures --
      # multiply, the mispredict bubble, the L0 d-cache, the coalescing store
      # queue -- so none of it transfers. See docs/bh_arch.md.
      issue:
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase R of
          perfbench/riscvbench: independent and dependent ``addi`` chains and
          independent multiplies all read 0.999 cycles per instruction from one
          issuing thread, and the same at two and three (0.998). One RV32IM
          instruction per cycle, and ``alu_forwarding`` with it -- the
          dependent chain, in which every instruction reads the previous one's
          result, is indistinguishable from the independent one.

          This is a floor as well as a confirmation: no probe in the whole
          benchmark can read below it, which is why a 1.000 anywhere else is
          only readable next to the four probes that read above it.

          TWO RUNS, ON ONE CARD, one operator, one power state, one day; the
          primary is tt_sim/perf/datasets/riscvbench-blackhole.csv with phase R
          valid. The companion --blocks 8 run reads 0.995 for the same probes,
          the 0.004 being its shorter baseline rather than the device.
      load_throughput:
        note: >
          NO NUMBER IS OVERRIDDEN HERE AND ONE THING ABOUT THAT IS WORTH
          SAYING OUT LOUD, because this entry is consumed as of 2026-08-06 and
          the arch merge is what makes it apply on Blackhole. Blackhole's
          BabyRISCV page rewrote the Load/Store Unit section and, in doing so,
          carries neither the sustained-load sentence nor the "Maximum loads in
          flight" column that Wormhole's does. It keeps the statement the
          formula is about ("a latency of N cycles means that N - 1 independent
          instructions need to follow the load if the latency is to be entirely
          hidden") and adds an eight-entry retire-order queue with the advice
          to "use distinct destination registers for each of the seven
          instructions following a load instruction" -- the same 8 and the same
          7. So the base section applying here is the file's ordinary
          convention (overrides carry differences, not repetitions) rather than
          a Wormhole number pushed into a Blackhole gap, and the corroboration
          below is a direct measurement of this formula ON Blackhole, which is
          the strongest statement available about whether it belongs there.
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase R of
          perfbench/riscvbench, and it is the one number here that comes out of
          the docs' FORMULA rather than off a row. ``rv_load_indep`` -- four
          rotating destination registers, so no load is read before the next
          issues -- reads 1.742 cycles per load. With a load latency of 8 the
          formula gives four loads every 8 - 1 cycles, i.e. 1.750. It agrees to
          0.008 of a cycle.

          It also corroborates the LATENCY from a second direction, which is
          what makes it worth recording separately: 1.742 is what the formula
          gives at N = 8 and nothing like what it gives at N = 2 (which would
          be one per cycle, the ``one_per_cycle_if_latency_under: 5`` branch).
          Two constructions that share no arithmetic agree that the latency in
          force for these accesses is the L1 d-cache MISS row.

          TWO RUNS, ON ONE CARD, one operator, one power state, one day;
          tt_sim/perf/datasets/riscvbench-blackhole.csv, phase R valid. The
          companion run reads 1.745.
      instruction_fetch:
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase F of
          perfbench/riscvbench: the same ``addi`` in loop bodies of 64, 128,
          256, 512, 1024 and 2048 instructions reads 0.998, 0.998, 0.998,
          0.998, 1.000 and 1.251 cycles per instruction. Flat to a thousandth
          of a cycle across 256 bytes to 4 KiB of instruction text, which is
          what "instruction fetches are expected to occur at most once every
          four cycles" predicts while the loop is resident, and it holds
          identically at one, two and three issuing threads -- so the fetch
          path is per-core rather than shared, which this page does not say.

          THE STEP IS NOT RECORDED IN THIS FILE AND DELIBERATELY SO. It
          locates a boundary in LOOP-BODY SIZE and not a cache capacity: this
          entry's own note says the miss cost is not published, no cache SIZE
          is published either, and a prefetch window or a TLB-like structure
          would produce the same column. A number with no documentary source
          has no home in these tables under the discipline they are kept to, so
          it is written down in docs/bh_arch.md instead. That tension is real
          and is stated there.

          PHASE G NARROWED IT, 2026-08-05, same card and same campaign: bodies
          of 1280, 1536 and 1792 instructions read 1.153, 1.252 and 1.252
          cycles per instruction against a 1024-instruction anchor compiled
          into the same kernel at 1.000. So the boundary is between 4096 and
          5120 bytes rather than between 4 KiB and 8 KiB, and the cost past it
          RISES ONCE MORE AND THEN SATURATES rather than stepping cleanly --
          which is consistent with partial residency of something holding about
          4 KiB, and equally consistent with a fixed prefetch reach. Neither is
          a documented quantity and neither is recorded here.

          FOUR RUNS, ON ONE CARD, one operator, one power state, one day;
          tt_sim/perf/datasets/riscvbench-blackhole.csv (phases F and G valid),
          its --blocks 8 companion, and riscvbench-blackhole-gset1.csv and
          -gset2.csv, which are the only measurements of the 6144- and
          7168-byte bodies. The --blocks 8 run reads 0.991-0.995 flat, 1.150 at
          1280 and 1.251 at 2048 -- the step to three decimal places.
      pipeline:
        stages: [frontend, ex1, ex2, load_store_unit, retire_unit]
        min_cycles_per_stage: 1
        provenance: isa_doc
        source: bh_riscv
        note: >
          Blackhole splits the integer stage: "Every instruction spends at
          least one cycle in EX1", then multiply and floating-point arithmetic
          "spend exactly one cycle in EX1, and then exactly one cycle in EX2".
          EX3 exists only in RISCV T2, for some vector instructions. The Retire
          Unit gains an eight-entry retire-order queue and instructions can
          populate it out of order while still retiring in order.
      integer_unit:
        default: 1
        multiply: 1
        multiply_ex2: 1
        divide_by_zero_or_one: 2
        divide_int_min_by_minus_one: 2
        divide_general: { cycles: 6, max: 33, bound: range }
        branch: 1
        branch_mispredict_bubble: 4
        branch_mispredict_observed: 5
        provenance: isa_doc
        source: bh_riscv#ex1
        note: >
          Two real differences from Wormhole. Multiply no longer blocks the
          integer stage for two cycles -- it is one cycle in EX1 plus one in
          EX2, so it pipelines. And the mispredict penalty doubles: "A
          mispredicted branch causes a four cycle pipeline bubble, which from
          an external perspective looks like mispredicted branches occupy EX1
          for five cycles". Divide is unchanged.
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase R of
          perfbench/riscvbench, cycles per instruction from one issuing thread:

            multiply, independent operands   0.999   (occupancy 1)
            multiply, dependent chain        1.985   (latency 1 + 1)
            divu 0x12345678 / 3             33.001
            branch, correctly predicted      0.999

          THE MULTIPLY PAIR IS THE ARCHITECTURAL DISCRIMINATOR and it comes out
          the Blackhole way. An occupancy of one and a latency of two is
          exactly what "exactly one cycle in EX1, and then exactly one cycle in
          EX2" means, and it is the one probe in this benchmark whose answer
          differs between the two chips for a documented reason -- Wormhole's
          multiply blocks the integer unit, so both readings would be 2.0
          there. Nothing has run this on Wormhole. As of 2026-08-06
          tt_sim/pe/rv/cost.py spends ``multiply`` + ``multiply_ex2`` as a
          scoreboard entry on the result register, so a dependent chain in
          tt-sim reads 2.000 against this 1.985 where it previously read 1.000
          (the occupancy was charged, the latency was not).

          THE DIVIDE LANDS AT THE TOP OF ITS RANGE, not the bottom. 33.001 is
          the ``max`` of the documented 6-33, for one dividend/divisor pair
          (0x12345678 / 3, recorded in the dataset header). ``tt_sim/perf/
          model.py`` charges every bound at its low end, so it charges 6 where
          this operand costs 33 -- an under-charge of 27 cycles per divide, in
          the direction the cost model's stated policy asks for but by a factor
          of five. The docs make the cost "dependent upon the magnitude of the
          dividend"; one point is not the curve, and the benchmark sweeps no
          others.

          THE MISPREDICT BUBBLE IS NOT TESTED BY ANY OF THIS, and conflating
          the two numbers is the mistake this paragraph exists to stop.
          ``branch_mispredict_bubble: 4`` is the SIZE of one mispredict. What
          phase C measures is how OFTEN one happens, and the answer is: not
          measurably. A never-taken branch reads 0.999, an always-taken one
          0.952, an alternating one 1.969 against 1.993 for its matched
          never-taken control -- so ``taken - not taken`` is -0.047 and
          ``alternating - not taken`` is -0.024, both NEGATIVE and both far
          below one cycle, let alone four. Taken branches are marginally
          CHEAPER than not-taken ones on this part. A four-cycle bubble
          occurring on any appreciable fraction of these branches could not
          hide in that. The size may be perfectly correct and untested; the
          rate is what was measured, and it is why ``tt_sim/pe/rv/cost.py``
          charging nothing for branches now has evidence behind it rather than
          only an argument.

          TWO RUNS, ON ONE CARD, one operator, one power state, one day;
          tt_sim/perf/datasets/riscvbench-blackhole.csv, phases R and C valid.
          The companion --blocks 8 run reads 33.004, 1.988 and 0.995, and its
          phase C was refused by the benchmark's own gate -- for the taken
          probes specifically, whose slope over that shorter baseline is barely
          above the control's. Its branch deltas are larger (-0.158, -0.132)
          and still negative.
      l0_data_cache:
        capacity_bytes: 64
        lines: 4
        line_bytes: 16
        flushed_by_fence_or_atomic: true
        periodic_flush_chance_per_hit: 0.008
        provenance: isa_doc
        source: bh_riscv#l0-data-cache
        note: >
          "Each baby RISCV has a tiny L0 data cache between it and L1. The
          capacity of this L0 data cache is a mere 64 bytes: 4 lines of 16
          bytes each. The entire L0 data cache will be flushed by any `fence`
          or atomic instruction, and cache hits also have a ~0.8% chance of
          flushing the entire cache ... The cache is _not_ coherent". Stores to
          L1 flush the containing line, so the cache is never dirty.

          ASSOCIATIVITY, INDEXING AND REPLACEMENT ARE NOT PUBLISHED, which is
          why only the capacity and line geometry are recorded. What the
          capacity ALONE settles is one-sided, and the one-sidedness is the
          point: a working set LARGER than 64 bytes cannot be resident, so it
          reaches ``l1_dcache_miss`` however the cache is organised. A working
          set at or below 64 bytes is NOT thereby predicted to hit -- that
          would need the organisation this page does not give, and the ~0.8 %
          periodic flush on top of it.

          TWO CONSUMERS, AND NEITHER IS A HIT RATE. Since 2026-08-06
          tt_sim/pe/rv/cost.py keeps a per-core line-tag model built from this
          geometry -- ``lines`` tags of ``line_bytes``, no data -- and charges
          an L1 load ``l1_dcache_hit`` when its line's tag is resident and
          ``l1_dcache_miss`` when it is not, with the documented flushes
          (stores flush the containing line; fence/atomic flushes all of it)
          applied and the unpublished properties all resolved in the generous
          direction (fully associative, least-recently-loaded replacement, no
          periodic flush) so the modelled count stays a floor. Before that,
          every L1 load charged the hit row outright and a pointer chase read
          ~2 where silicon reads 8.098. The other consumer is
          tt_sim/perf/riscv_bench_sweep.py, which reads only the capacity to
          pick which row a BENCHMARK PROBE of known working set is predicted
          against.
      load_latency:
        core_local_data_ram: 2
        l1_dcache_hit: 2
        mailboxes_pcbufs_ttsync_semaphores: { cycles: 3, bound: at_least }
        tensix_gprs_backend_config_tdma: { cycles: 4, bound: at_least }
        tilectrl_pic_noc0_noc1_overlay: { cycles: 7, bound: at_least }
        core_local_data_ram_slow_path: { cycles: 8, bound: at_least }
        l1_dcache_miss: { cycles: 8, bound: at_least }
        l1_atomic: { cycles: 12, bound: at_least }
        minimum: 2
        provenance: isa_doc
        source: bh_riscv#loadstore-unit
        note: >
          Blackhole gains an L0 data cache, so L1 has two latencies (2 on hit,
          >= 8 on miss) where Wormhole has one, plus a >= 12 row for atomics
          that Wormhole does not have. TDMA config moves from the >= 7 group to
          the >= 4 group. Core-local data RAM gains a second, slow mapping
          (>= 8) reachable from any RISCV and over the NoC. The table does not
          repeat Wormhole's "Maximum loads in flight" column.

          THE >= 7 ROW IS OTHERWISE IDENTICAL TO WORMHOLE'S, AND IT NAMES THE
          NIUs: "Tile control / debug / status; PIC configuration and status;
          NoC 0 configuration and command; NoC 1 configuration and command;
          NoC overlay configuration and command". Both architectures publish
          the NIU register block's latency and neither publishes it separately
          from the overlay's -- see the base section's note for why that
          mattered.
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase R of
          perfbench/riscvbench, as pointer chases so that the body is one
          instruction and the reading is a load-use LATENCY undivided:

            L1, 64-node ring 16 bytes apart   8.098 cycles
            the TRISC stack, at 0xFFB00F98    1.985 cycles

          THE STACK ROW IS THE CLEAN ONE. 0xFFB00F98 is core-local data RAM --
          classified by tt_sim/pe/rv/cost.classify_address, the simulator's own
          classifier, so the prediction and the simulation cannot disagree --
          and ``core_local_data_ram: 2`` is what it reads.

          THE L1 ROW IS ``l1_dcache_miss``, AND THE DOCUMENT SAYS WHY. 8.098 is
          the miss row, not ``l1_dcache_hit``; the probe chases a 64-node ring
          16 bytes apart, which is a 1 KiB working set against an L0 data cache
          whose published capacity is 64 bytes (see ``l0_data_cache``). Sixteen
          times the capacity cannot be resident, so the chase reaches the miss
          row by construction and no organisation of the cache could change
          that. The measurement is the reason the capacity was looked up, not
          the reason the row applies. ``rv_load_indep`` agrees from a different
          construction: see ``load_throughput`` above. Since 2026-08-06 the
          simulator agrees too: tt_sim/pe/rv/cost.py's L0 line model charges
          this row to any L1 load whose line is not among the tracked tags, so
          the same chase in tt-sim now pays 8 per load where it used to pay
          the hit row's 2.

          WHAT IS NOT EXPLAINED is ``rv_load_indep``: its four addresses span
          exactly four 16-byte lines, i.e. exactly the published capacity, and
          it still reads the miss row's sustained rate. A working set AT the
          capacity is not predicted to hit -- associativity, indexing and
          replacement are unpublished and the ~0.8 % periodic flush is on top of
          them -- so this is a gap in what the page says rather than a
          disagreement with it. Nothing here is charged differently on the
          strength of it.

          TWO RUNS, ON ONE CARD, one operator, one power state, one day;
          tt_sim/perf/datasets/riscvbench-blackhole.csv, phase R valid. The
          companion run reads 8.100 and 1.988.
      store_throughput:
        l1_period_cycles: 5
        l1_coalesced_period_cycles: 1
        other_regions_period_cycles: 1
        provenance: isa_doc
        source: bh_riscv#loadstore-unit
        note: >
          Blackhole adds a coalescing store queue: "if it can [coalesce], the
          constituent stores have a throughput of one store every cycle,
          otherwise the throughput is one coalesced store every five cycles".
          Coalescing requires the stores to target the same 16-byte aligned
          region of L1 with start addresses within +/-4 of each other, and
          never applies outside L1.
        corroboration: >
          MEASURED ON BLACKHOLE SILICON, 2026-08-05, phase R of
          perfbench/riscvbench, and this is the entry the benchmark was best
          placed to test because its two rows are predicted FIVE TIMES apart on
          this architecture and identical on the other:

            stores to four different 16-byte blocks   5.217 cycles each
            stores 4 bytes apart in ONE such block    0.999 cycles each
            stores to the stack (core-local RAM)      0.999 cycles each

          The coalescing predicate is documented as "the same 16-byte aligned
          region of L1, with start addresses within +/-4", which is exactly
          what the second probe does and exactly what the first one avoids, and
          the two come out 5.2x apart. ``l1_coalesced_period_cycles: 1`` and
          ``other_regions_period_cycles: 1`` both read 0.999.

          The 5.217 is ABOVE the documented 5, by more than this instrument's
          0.034-cycle resolution -- the only entry in the RISC-V section where
          that happens. "At most one store every five cycles" is a floor and
          the measurement respects it; what the extra 0.2 cycles is, this
          cannot say. It is not the control over-subtraction, which biases the
          other way.

          BLACKHOLE ONLY, and pointedly so: Wormhole publishes no coalescing
          store queue, so there the two probes are predicted identical. Running
          this pair on a Wormhole card is the cheapest cross-architecture
          discriminator the benchmark has, and nothing has done it.

          TWO RUNS, ON ONE CARD, one operator, one power state, one day;
          tt_sim/perf/datasets/riscvbench-blackhole.csv, phase R valid. The
          companion run reads 5.217, 0.994 and 0.995.
      local_data_ram_reset_cycles:
        cycles: 2048
        provenance: isa_doc
        source: bh_riscv#local-data-ram
        note: >
          "When the RISCV comes out of reset, the local data RAM will spend up
          to 2048 clock cycles resetting its contents to zero. If a RISCV core
          tries to access the RAM during this time, the core will be
          automatically stalled." Not a per-instruction cost, but it is a real
          stall on a path tt-metal firmware takes on every launch, and it has
          no Wormhole equivalent.
    l1:
      note: >
        BlackholeA0/TensixTile/L1.md exists but publishes no bank or port
        timing, so the Wormhole bank model above is carried over unchanged.
        That carry-over is an assumption, not a sourced fact: Blackhole's L1 is
        1536 KiB rather than 1464 KiB (ttsim src/config.h TENSIX_SRAM_SIZE), so
        at minimum the bank size differs.
      bank_size_kib:
        provenance: unknown
        note: >
          Blackhole L1 is 1536 KiB total; the bank count and per-bank size are
          not published, so 1536/16 = 96 KiB is a plausible inference and is
          deliberately not recorded as a fact.
