# Per-instruction cycle costs for the Tensix coprocessor backend units.
#
# This file parallels ``tensix_instructions.yaml``: the top-level keys under
# ``units`` are the ``ex_resource`` values that file uses (MATH, SFPU, THCON,
# SYNC, TDMA, CFG, PACK, UNPACK, XMOV, NONE), and the instruction names under
# each unit are its instruction names. The two are meant to be read side by
# side -- ``tensix_instructions.yaml`` says what an opcode *is*, this says what
# it *costs*.
#
# CONSUMED, behind ``TT_SIM_COST_MODEL``, by eight of the nine backend units
# (every unit but TDMA -- ``UNWIRED_UNITS`` in tt_sim/perf/costs_test.py names
# it and why), through the loader (``tt_sim/perf/costs.py``) and the policy
# layer (``tt_sim/perf/model.py``). See ROADMAP.md section I "Per-unit
# cycle-cost tables" and docs/plans/cost-model.md.
#
# ---------------------------------------------------------------------------
# PROVENANCE IS THE POINT
# ---------------------------------------------------------------------------
# tt-sim is a cycle-*approximate* estimator, not cycle-accurate (ROADMAP.md
# "Positioning"). A table of plausible-looking constants with no attribution is
# worse than no table, because it cannot be improved: nobody can tell which
# numbers came from a document and which were made up. So every entry carries a
# ``provenance`` from this vocabulary:
#
#   isa_doc          A number stated verbatim in the public Tenstorrent ISA
#                    documentation. ``source`` is required and names the
#                    document and section.
#   isa_doc_derived  Arithmetic on an isa_doc number (almost always
#                    "occupancy = 1 / throughput_ipc"). ``source`` and
#                    ``derivation`` are required.
#   vendor_source    Taken from vendor source code (ttsim, tt-metal, tt-llk)
#                    rather than prose documentation. ``source`` is required.
#   vendor_source_derived
#                    Arithmetic on vendor numbers -- what isa_doc_derived is to
#                    isa_doc, one tier down. ``source`` and ``derivation`` are
#                    required, and the derivation must be complete enough for a
#                    reader to redo it, because nobody published the result.
#                    Ranked below vendor_source (no document prints the answer)
#                    and above estimated (nothing here is a judgement call).
#                    Used by exactly one entry so far -- Wormhole's DRAM access
#                    latency in unit_costs.yaml -- and a test pins that list.
#   estimated        Uncalibrated. A guess, however educated. ``note`` is
#                    required and must say what would replace it.
#   unknown          Deliberately left without a number because no source gives
#                    one. ``note`` is required. An entry with this provenance
#                    carries no cycle counts at all -- that is the honest
#                    answer, and a reader can grep for it.
#
# Rule: **an entry's provenance is the weakest provenance of any number in it.**
# So an entry whose latency is documented but whose occupancy is derived reads
# ``isa_doc_derived``. This errs towards understating what is sourced, which is
# the safe direction.
#
# Where the documentation gives a throughput but not a latency, or vice versa,
# only the documented one is recorded as ``isa_doc``. The other is either
# derived (and marked so) or absent. Do not "complete" a row by inventing its
# missing half.
#
# ---------------------------------------------------------------------------
# FIELDS
# ---------------------------------------------------------------------------
# Per instruction entry:
#
#   latency         Cycles from issue until the result is observable. Matches
#                   the "Latency" column of the ISA docs' per-unit tables.
#   occupancy       Cycles the unit cannot begin another instruction. This is
#                   the number Phase 5 of the pump plan needs: "busy until
#                   cycle c + N".
#   throughput_ipc  Instructions per cycle, as the ISA docs state it.
#   ipc_group       The name of the throughput group ``occupancy`` is charged
#                   against, when the source says the unit's limit is per-group
#                   rather than whole-unit. Transcribed VERBATIM from an "IPC
#                   group" column, never inferred: an occupancy is back-pressure
#                   on the next instruction *of that group*, so a wrong grouping
#                   lets an instruction through that the hardware would stall.
#                   Absent means whole-unit, which is the only safe default and
#                   is what every unit but Blackhole's Configuration Unit gets --
#                   no other page publishes such a column (checked: the Matrix
#                   Unit, Scalar Unit and Sync Unit tables have Latency and
#                   Throughput columns and nothing else, and Wormhole's own
#                   Configuration Unit page states its limits as prose).
#   scales_with     A named multiplier the cost is repeated for, e.g.
#                   ``fidelity_phases``. Recorded rather than folded in, since
#                   the multiplier is a runtime property.
#   arch            Present only on instructions that exist on one
#                   architecture. ``blackhole`` means the loader drops the
#                   entry for Wormhole. (Matches how ``tensix_instructions.yaml``
#                   keeps Blackhole's superset ops in the shared table.)
#   isa_doc_name    Set when this file's key -- which follows
#                   ``tensix_instructions.yaml`` -- differs from the name the
#                   ISA docs use.
#   corroboration   An INDEPENDENT OBSERVATION that agrees with the numbers
#                   above -- a silicon measurement, a vendor comment, a second
#                   derivation from different inputs. Deliberately NOT a
#                   provenance rank: provenance answers "where did this number
#                   come from", corroboration answers "has anything checked
#                   it", and they are different axes. A corroboration can
#                   never be an entry's authority, so it cannot launder a
#                   guess into a fact, and ``PROVENANCE_RANK`` is untouched by
#                   it. Where it records a measurement it must say how many
#                   runs on how many parts, because one run on one card is
#                   what it usually is.

# ---------------------------------------------------------------------------
# WHY THERE IS NO ``measured`` PROVENANCE
# ---------------------------------------------------------------------------
# The obvious move, the first time silicon disagreed with a document, is to add
# a ``measured`` rank at the top: a direct measurement of the hardware surely
# outranks prose describing it. It is the wrong move, for three reasons, and
# the reasons are recorded here because the question will come back.
#
# 1. THEY ARE USUALLY NOT THE SAME QUANTITY. The first real disagreement --
#    RDCFG, see its entry -- was a documented *latency* being compared against
#    a measured *occupancy*. Ranking them against each other would have picked
#    a winner between two facts that were both true, and thrown one away.
# 2. A DOCUMENT DESCRIBES EVERY PART; A RUN SAMPLES ONE. The measurement that
#    prompted this was one run, on one card, at one clock state, through an
#    instrument with two known systematic biases (see
#    ``tensix_bench_sweep.FIT_RESOLUTION_NOTE``). That is weaker evidence about
#    the architecture than a vendor statement, not stronger.
# 3. A TOP RANK IS A LICENCE TO OVERWRITE. Provenance exists so that a number
#    can be traced and improved. A rank that let one unreplicated run replace a
#    published figure would turn the tables into a fit to whatever was last
#    measured, which is the exact failure the calibration ladder in
#    docs/plans/cost-model.md is built to avoid.
#
# So a measurement enters as ``corroboration`` (above) and never as authority.
# When one genuinely contradicts a document about the same quantity, the honest
# outcomes are: record both and say so, or drop to ``unknown``. Not substitute.
#
# A cost value is either a plain integer (meaning "exactly N cycles") or a
# mapping with ``cycles`` plus a ``bound`` from {exact, at_least, at_most,
# approximate, range}; ``range`` also carries ``max``. The bounds exist because
# the ISA docs genuinely write ">= 2 cycles", "~5 cycles" and "<= 2 cycles",
# and flattening those to a single integer would be inventing precision.
#
# An absent ``latency`` / ``occupancy`` / ``throughput_ipc`` means the source
# does not give one. Every entry that is missing all three must carry a
# ``note``.
#
# Per-unit ``not_documented`` lists opcodes that the unit's ISA-doc table
# simply does not mention. They are named rather than silently omitted so that
# "no entry" is visibly a gap in the source, not an oversight here.

schema_version: 1

# Short ids used by every ``source`` field, so an entry reads
# ``source: wh_matrix_unit#instruction-latency-and-throughput``. The test
# asserts every source resolves to one of these.
documents:
  repo: https://github.com/tenstorrent/tt-isa-documentation
  wh_matrix_unit: WormholeB0/TensixTile/TensixCoprocessor/MatrixUnit.md
  wh_vector_unit: WormholeB0/TensixTile/TensixCoprocessor/VectorUnit.md
  wh_scalar_unit: WormholeB0/TensixTile/TensixCoprocessor/ScalarUnit.md
  wh_sync_unit: WormholeB0/TensixTile/TensixCoprocessor/SyncUnit.md
  wh_config_unit: WormholeB0/TensixTile/TensixCoprocessor/ConfigurationUnit.md
  wh_misc_unit: WormholeB0/TensixTile/TensixCoprocessor/MiscellaneousUnit.md
  wh_packers: WormholeB0/TensixTile/TensixCoprocessor/Packers/README.md
  wh_unpackers: WormholeB0/TensixTile/TensixCoprocessor/Unpackers/README.md
  wh_unpacr: WormholeB0/TensixTile/TensixCoprocessor/UNPACR_Regular.md
  wh_xmov: WormholeB0/TensixTile/TensixCoprocessor/XMOV.md
  wh_mop_expander: WormholeB0/TensixTile/TensixCoprocessor/MOPExpander.md
  wh_replay: WormholeB0/TensixTile/TensixCoprocessor/REPLAY.md
  wh_l1: WormholeB0/TensixTile/L1.md
  bh_vector_unit: BlackholeA0/TensixTile/TensixCoprocessor/VectorUnit.md
  bh_config_unit: BlackholeA0/TensixTile/TensixCoprocessor/ConfigurationUnit.md
  bh_sync_unit: BlackholeA0/TensixTile/TensixCoprocessor/SyncUnit.md

# Non-ISA-doc sources, used only where the ISA docs are silent. Paths are
# relative to a tt-metal checkout (0.74 was the one read). These are second-tier
# authority: they are vendor code and vendor tech reports rather than the ISA
# contract, and several of them disagree with each other (see the Blackhole
# clock note in tt_sim/perf/unit_costs.yaml), so an entry sourced from here is
# marked ``vendor_source``, never ``isa_doc``.
vendor_documents:
  repo: https://github.com/tenstorrent/tt-metal
  version_read: "0.74"
  tm_gemm_flops: tech_reports/GEMM_FLOPS/GEMM_FLOPS.md
  tm_matrix_engine: tech_reports/matrix_engine/matrix_engine.md
  tm_matmul_op: ttnn/cpp/ttnn/operations/matmul/device/matmul_device_operation.cpp
  tm_operation_hpp: ttnn/api/ttnn/operation.hpp
  tm_reduce_scatter: ttnn/cpp/ttnn/operations/ccl/reduce_scatter/device/reduce_scatter_device_operation.cpp
  tm_llk_perf_counters: tt_metal/tt-llk/docs/performance_counters/performance_counters.md
  tm_llk_unpack_ab_matmul: tt_metal/tt-llk/tt_llk_blackhole/llk_lib/llk_unpack_AB_matmul.h

units:

  # -------------------------------------------------------------------------
  MATH:
    isa_doc_name: Matrix Unit (FPU)
    backend: tt_sim/pe/tensix/backends/matrix.py
    source: wh_matrix_unit#instruction-latency-and-throughput
    note: >
      The Wormhole table is the only per-op latency/throughput table published
      for this unit. BlackholeA0/.../MatrixUnit.md is a stub pointing back at
      it, and the Wormhole "Performance" section says outright that "relative
      ratios between instructions broadly apply to Blackhole, but absolute
      throughput and product-specific tile counts differ" -- so these cycle
      counts are used unchanged for both arches, and the arch difference is
      carried by the clock rate (see tt_sim/perf/unit_costs.yaml) rather than
      by the per-op numbers.
    fidelity_phases:
      cycles_per_tile: { LoFi: 16, HiFi2: 32, HiFi3: 48, HiFi4: 64 }
      phases: { LoFi: 1, HiFi2: 2, HiFi3: 3, HiFi4: 4 }
      mul_adds_per_cycle_lofi: 4096
      # Needed to turn the per-tile figure above into the per-instruction one
      # the simulator charges. Kept here rather than in code because it is a
      # sourced number like the others -- see tt_sim/perf/model.py's
      # UnitCostModel.fidelity_occupancy, the first consumer of this block.
      mvmuls_per_tile:
        count: 16
        provenance: isa_doc_derived
        source: wh_matrix_unit#mvmul
        derivation: >
          One MVMUL multiplies eight rows of SrcB by a 16x16 block of SrcA into
          eight rows of Dst. A 32x32 by 32x32 tile matmul is four 16x16 output
          faces, each accumulating over two K faces, and each 16x16 face takes
          two MVMULs at eight rows apiece: 4 * 2 * 2 = 16 instructions per
          fidelity phase. Cross-checks against the vendor numbers above --
          8*16*16 = 2048 multiply-accumulates is 4096 muladds, exactly the
          quoted per-cycle rate, so 16 MVMULs is 16 cycles, which is
          cycles_per_tile at LoFi -- and against tt-sim's own six replay
          (a 128^3 bf16 matmul), which issues 1024 MVMULs per fidelity phase
          for 64 tile matmuls.
        corroboration: >
          MEASURED ON SILICON, 2026-08-04, and this is the number the whole
          MATH table leans on. Phase B of perfbench/tensixbench times a real
          matmul_tiles inner loop on the math thread at three fidelities and
          differences them, so the circular-buffer waits, the two tile unpacks
          and the semaphore handshake cancel and only the extra MVMULs remain:

            LoFi  -> HiFi2   17.55 cycles measured, 16 predicted (+1.55)
            HiFi2 -> HiFi4   33.65 cycles measured, 32 predicted (+1.65)

          16 and 32 are exactly ``count`` x one cycle per MVMUL per added
          phase. The residual is +1.6 cycles on each step -- ~10 %, in the
          direction of the MVMULs costing 1.05-1.10 cycles rather than 1.00 --
          and it is a *step* residual, not a growing one, so nothing here
          suggests the count is anything but 16. Had the count been wrong the
          steps would have been wrong in proportion: a count of 8 predicts 8
          and 16, a count of 32 predicts 32 and 64, and neither is within
          twice the residual of what was measured.

          THIS IS THE FIRST CHECK OF ANY KIND ON THIS NUMBER. It was derived
          arithmetic until now, load-bearing on every simulated matmul, and
          wrong by 2.5x on all of them if it had been wrong at all. The
          confound the design named in advance -- a feeder-limited loop, in
          which raising fidelity buys back slack and all three slopes come out
          equal -- did not occur: the three separate cleanly (34.92, 52.47,
          86.12 cycles per call).

          ONE RUN, ON ONE CARD:
          tt_sim/perf/datasets/tensixbench-blackhole.csv (firmware bundle
          19.6.0, KMD 2.9.0, --blocks 32 --iters 64), phase B rows. It
          corroborates the isa_doc_derived derivation above and does not
          replace or re-rank it. See docs/plans/tensix-cost-benchmark.md.
      provenance: vendor_source
      source: tm_gemm_flops#L101
      note: >
        The ISA docs say only that fidelity phases cost one instruction each,
        without a cycles-per-tile figure. tt-metal states one directly:
        "Cycle_per_tile is the ideal compute cycle for each tile, which depends
        on math fidelity (LoFi: 16, HiFi2: 32, HiFi3: 48, HiFi4: 64)". That is
        a whole-tile figure, not a per-MVMUL one, so it is recorded here at
        unit level rather than folded into the MVMUL entry -- deriving a
        per-instruction cost from it would require assuming how many MVMULs a
        tile takes, which is a kernel property.

        Corroborating, from the same vendor tree: the matrix engine performs
        "8x16 x 16x16 = 8x16 in a single cycle. This is 2*8*16*16 = 4096
        muladds in a single cycle" (tm_matmul_op:206-208, tm_matrix_engine:14),
        and the fidelity multiplier is 1/2/3/4 for LoFi/HiFi2/HiFi3/HiFi4
        (tm_operation_hpp OpPerformanceModel::fidelity_multiplier). Note the
        LLK performance-counter doc gives the weighting as "1 for LoFi, 2 for
        HiFi2, 4 for HiFi4" and omits HiFi3 (tm_llk_perf_counters#L871), so the
        vendor sources are not perfectly consistent with each other -- another
        reason this is vendor_source and not isa_doc.
    instructions:
      MVMUL:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        scales_with: fidelity_phases
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        corroboration: &math_wait_gate_two_regimes >
          THE OCCUPANCY OF 1 ABOVE IS THE MOP-ISSUED, BACK-TO-BACK RATE, and
          that is the regime every real kernel is in. Blackhole silicon,
          2026-08-04, measures it at ~1.07 cycles per MVMUL: phase B of
          perfbench/tensixbench times a real matmul_tiles inner loop at three
          fidelities and gets 34.92, 52.47 and 86.12 cycles per call for 16, 32
          and 64 MVMULs, so the marginal cost is (86.12 - 34.92) / (64 - 16) =
          1.07, and 1.10 and 1.05 from the two adjacent pairs. The MVMULs there
          come out of a ttreplay buffer driven by the MOP expander, which feeds
          the FPU one per cycle exactly as the ISA docs' throughput row says.

          THERE IS A SECOND REGIME, ~6x SLOWER, and phase A can only ever
          observe that one. An MVMUL/ELWADD/ELWMUL issued individually as a
          .ttinsn word pays the Wait Gate's "SrcA[bank].AllowedClient !=
          MatrixUnit" check per instruction, and measures 5.989 / 5.976 / 5.974
          cycles from one thread, 12.01 / 11.97 / 11.97 from two and 18.04 /
          17.97 / 17.97 from three -- a clean 3.0x, aggregate flat at ~6.0
          cycles per instruction, i.e. ONE SHARED UNIT at ~6 cycles rather than
          any kind of contention. ~6 is the documented latency of 5 plus one,
          consistent with each individually issued op waiting for its
          predecessor to retire instead of pipelining.

          THE TABLE DELIBERATELY CARRIES THE FIRST NUMBER. Every non-
          experimental LLK path that issues these opcodes records them into a
          replay buffer and replays them from a MOP -- llk_math_matmul.h and
          llk_math_reduce.h for MVMUL, llk_math_eltwise_binary.h via
          ckernel_template for ELWADD/ELWMUL -- so a kernel tt-sim runs never
          issues one individually. Charging 6 would mis-cost every real matmul
          by ~6x. The exception is
          tt_llk_blackhole/llk_lib/experimental/llk_math_matmul_custom_no_mop.h,
          which is named for issuing them inline and is the one shape that
          would pay the Wait-Gate figure.

          NO DATA-FORMAT AXIS IS RESOLVABLE, measured rather than assumed.
          This entry has never distinguished cost by source data format, and
          until 2026-08-04 nothing had checked whether it should: the ISA docs
          give the matrix unit 1 IPC with no format qualification, which is an
          absence of a claim rather than a claim of independence. Experiment X2
          ran the same phase A burst four times, changing only the format the
          Matrix Unit decodes, and the three MATH probes are flat:

            probe        bf16      fp32      fp16      tf32    spread
            MVMUL       5.988     5.988     5.988     5.989     0.001
            ELWADD      5.974     5.974     5.974     5.975     0.001
            ELWMUL      5.973     5.973     5.973     5.974     0.001

          0.001 cycles of spread against a fitted resolution of 0.036-0.052,
          i.e. the instrument could have seen an effect ~40x smaller than the
          smallest one it would have taken to matter, and saw none.

          THE NULL CONTROL IS WHAT MAKES THAT A RESULT. bf16 and fp32 decode to
          the same SrcAStyle (BF16) in the functional models, so they CANNOT
          differ if those models are right; the sweep predicts it in advance and
          labels the pair "as predicted: indistinguishable". They came out at
          exactly 0.000 on all three probes. An instrument that shows no
          difference anywhere might simply be blind; this one was asked a
          question whose answer was known beforehand and got it right, so the
          absence of a tf32/fp16 effect is evidence rather than silence.

          TWO CAVEATS, AND NEITHER MAY BE DROPPED WHEN THIS IS QUOTED:
          (1) it is the WAIT-GATE regime described above, ~6 cycles per
          instruction, NOT the MOP-issued ~1 cycle this entry charges -- a
          format effect confined to the MOP path would not appear here at all;
          (2) one run per format, on one part.

          FOUR RUNS, ON ONE PART, one per format, in
          tt_sim/perf/datasets/, named tensixbench-blackhole-unpacr-nop-bf16,
          -fp32, -tf32 and -fp16 (firmware bundle 19.6.0, KMD 2.9.0, --blocks
          32 --phase a --dvalid-unpacr-nop --src-format <fmt> --variants t1).
          They
          replace SETDVALID with UNPACR_NOP + set_dvalid, which is what makes
          the source format defined at all on Blackhole. Reproduce with
          `python3 -m tt_sim.perf.tensix_bench_sweep --formats`.

          ONE RUN, ON ONE CARD:
          tt_sim/perf/datasets/tensixbench-blackhole.csv (firmware bundle
          19.6.0, KMD 2.9.0, --blocks 32 --iters 64 --dvalid-once), which holds
          both phases. Its predecessor's MATH rows were an artefact of an
          illegal per-thread SETDVALID setup and are retained only as the
          control tensixbench-blackhole-dvalid-per-thread.csv; do not read that
          file's 0.998 as agreement with the 1 above. Corroboration only: it
          does not change the provenance rank. See
          docs/plans/tensix-cost-benchmark.md and
          docs/plans/matrix-unit-thread-contention.md.
        note: >
          Footnote (dagger) on the throughput column: "If multiple fidelity
          phases are in use, then one instruction is required per fidelity
          phase, so the effective IPC decreases as the number of fidelity
          phases increases." The docs do not give a cycles-per-phase figure
          directly; the "Performance" table's TFLOP/s figures halve from 1 to
          2 phases and quarter from 1 to 4, consistent with one issue per
          phase. ``scales_with`` records the dependency without picking a
          multiplier here, since the phase count is a runtime property of
          ConfigState.
      DOTPV:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        scales_with: fidelity_phases
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      GAPOOL:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        scales_with: fidelity_phases
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      ELWMUL:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        scales_with: fidelity_phases
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        corroboration: *math_wait_gate_two_regimes
      GMPOOL:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        note: >
          Does not need multiple fidelity phases -- the Performance table
          quotes the same TFLOP/s for all four phase columns.
      ELWADD:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        corroboration: *math_wait_gate_two_regimes
      ELWSUB:
        latency: 5
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      SETRWC:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      INCRWC:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      CLEARDVALID:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      CLREXPHIST:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      GATESRCRST:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      SHIFTXA:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      ZEROACC:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      ZEROSRC:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      TRNSPSRCB:
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      SHIFTXB:
        latency: 2
        throughput_ipc: 0.5
        occupancy: 2
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      MOVD2A:
        latency: 2
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        note: >
          Footnote (double dagger): "Only certain Matrix Unit (FPU)
          instructions can be used to hide this latency; see the relevant
          instruction pages for details."
      MOVA2D:
        latency: 4
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
        note: latency is hideable only by certain FPU instructions (double dagger).
      MOVDBGA2D:
        latency: 4
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      MOVB2D:
        latency: 4
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      MOVB2A:
        latency: 4
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_matrix_unit#instruction-latency-and-throughput
        derivation: occupancy = 1 / throughput_ipc
      MOVD2B:
        provenance: unknown
        note: >
          Listed in the unit's instruction matrix (Dst -> SrcB) but absent from
          the latency/throughput table. Its sibling MOVD2A is 2 cycles and the
          SrcA-writing moves are 4, so a guess either way would be arbitrary.
      TRNSPSRCA:
        provenance: unknown
        note: >
          TRNSPSRCB is in the latency table at 1 cycle; TRNSPSRCA is not in the
          table and has no page in the Wormhole tree.
      MOVDBGB2D:
        arch: blackhole
        provenance: unknown
        note: >
          Blackhole-only, and listed in tt_sim's UNMODELLED_BLACKHOLE_INSTRUCTIONS.
          No latency published.
    not_documented:
      instructions:
        [
          APOOL3S1,
          APOOL3S2,
          CONV3S1,
          CONV3S2,
          MFCONV3S1,
          MPOOL3S1,
          MPOOL3S2,
          RAREB,
          SETASHRMH,
          SETASHRMH0,
          SETASHRMH1,
          SETASHRMV,
          SETIBRWC,
          SETPKEDGOF,
        ]
      note: >
        Absent from the ISA docs' latency/throughput table. The first seven are
        the "Legacy instructions" the Wormhole page describes as neutered
        (MFCONV3S1 / CONV3S* / APOOL3S* compute "Dst += 0"; MPOOL3S* do a
        degenerate GMPOOL) and explicitly marks NonContractualBehavior, so
        there is nothing worth costing. The SETASHR* / SETIBRWC / SETPKEDGOF /
        RAREB group simply has no published timing.

  # -------------------------------------------------------------------------
  SFPU:
    isa_doc_name: Vector Unit (SFPU)
    backend: tt_sim/pe/tensix/backends/vector.py
    source: wh_vector_unit#instructions
    note: >
      Latencies are per the Wormhole table; the Blackhole table lists identical
      IPC and latency for every instruction the two share, so only the
      Blackhole-only opcodes appear with ``arch: blackhole`` and there is no
      per-arch override for this unit. The arch difference is the clock: the
      Blackhole page notes the SFPU "clocks at 1.35 GHz rather than 1 GHz".

      Several instructions appear on multiple rows of the doc's table, one per
      mode, sometimes with different latencies. Where the modes disagree the
      entry records the worst case with ``bound: at_most`` and says so.

      The unit has five sub-units (load, simple, MAD, round, store) but "can
      only accept one instruction per cycle from the outside world, so by
      default four fifths of the Vector Unit (SFPU) is always idle";
      SFPLOADMACRO is the only way to exceed 1 IPC.
    instructions:
      SFPADDI: &sfpu_2cyc
        latency: 2
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
      SFPADD: *sfpu_2cyc
      SFPMAD: *sfpu_2cyc
      SFPMUL: *sfpu_2cyc
      SFPMULI: *sfpu_2cyc
      SFPLUT: *sfpu_2cyc
      SFPLUTFP32: *sfpu_2cyc
      SFPABS: &sfpu_1cyc
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
      SFPAND: *sfpu_1cyc
      SFPCAST: *sfpu_1cyc
      SFPCOMPC: *sfpu_1cyc
      SFPDIVP2: *sfpu_1cyc
      SFPENCC: *sfpu_1cyc
      SFPEXEXP: *sfpu_1cyc
      SFPEXMAN: *sfpu_1cyc
      SFPIADD: *sfpu_1cyc
      SFPLOAD: *sfpu_1cyc
      SFPLOADI: *sfpu_1cyc
      SFPLZ: *sfpu_1cyc
      SFPMOV: *sfpu_1cyc
      SFPNOP: *sfpu_1cyc
      SFPNOT: *sfpu_1cyc
      SFPOR: *sfpu_1cyc
      SFPPOPC: *sfpu_1cyc
      SFPPUSHC: *sfpu_1cyc
      SFPSETCC: *sfpu_1cyc
      SFPSETEXP: *sfpu_1cyc
      SFPSETMAN: *sfpu_1cyc
      SFPSETSGN: *sfpu_1cyc
      SFPSHFT: *sfpu_1cyc
      SFPSTORE: *sfpu_1cyc
      SFPTRANSP: *sfpu_1cyc
      SFPXOR: *sfpu_1cyc
      SFP_STOCH_RND:
        isa_doc_name: SFPSTOCHRND
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
        note: >
          Every SFPSTOCHRND row in the doc's table (sign-magnitude shifts and
          all three conversion modes) is 1 cycle at 1 IPC.
      SFPSWAP:
        latency: 2
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
        note: >
          The doc gives IPC as "<= 1" for every SFPSWAP row, so 1 is an upper
          bound on throughput and the derived occupancy of 1 is a lower bound.
          No number is published for the degraded case.
      SFPSHFT2:
        latency: { cycles: 2, bound: at_most }
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
        note: >
          Mode-dependent: the LReg-shuffle modes are 1 cycle at 1 IPC, the
          lane-rotate modes are 2 cycles at "<= 1" IPC. Recorded as the worst
          case; the modelled cost should pick the mode once the frontend passes
          one through.
      SFPCONFIG:
        latency: { cycles: 2, bound: at_most }
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
        note: >
          The doc lists "<= 2 cycles" for the configuration-write mode and
          1 cycle for the LReg-broadcast mode.
      SFPLOADMACRO:
        throughput_ipc: 1
        provenance: isa_doc
        source: wh_vector_unit#instructions
        note: >
          The doc's latency column says "Complex" -- SFPLOADMACRO behaves like
          SFPLOAD and then schedules up to four additional vector instructions,
          so its cost is the cost of what it expands to. Deliberately left
          without a latency rather than guessing one; it is also the only way
          to have more than one SFPU sub-unit active at a time, so a model that
          collapses it to a single number would misrepresent the unit.
      SFPARECIP:
        arch: blackhole
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: bh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
      SFPGT:
        arch: blackhole
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: bh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
      SFPLE:
        arch: blackhole
        latency: 1
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: bh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc
      SFPMUL24:
        arch: blackhole
        latency: 2
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: bh_vector_unit#instructions
        derivation: occupancy = 1 / throughput_ipc

  # -------------------------------------------------------------------------
  THCON:
    isa_doc_name: Scalar Unit (ThCon)
    backend: tt_sim/pe/tensix/backends/thcon.py
    source: wh_scalar_unit
    note: >
      This is the one unit whose ISA-doc table is *already* an occupancy table:
      its column is headed "Number of cycles required for execution", and the
      page states the unit "is executing at most one instruction at a time, and
      has no internal pipelining", with the issuing thread unable to start any
      further instruction (in any unit) until it completes. So occupancy here
      is isa_doc, not derived, and throughput_ipc is the unit-level 1.
      No Blackhole ScalarUnit.md exists, which per the Blackhole tree's
      convention means the behaviour is shared.

      BOTH HALVES OF THAT SENTENCE ARE NOW CONSUMED (2026-08-11, ROADMAP item
      3). The unit half -- "No instructions from any other thread can pass
      through their Wait Gate and enter the Scalar Unit" -- has always been the
      ordinary issue refusal (``is_occupied``). The *thread* half -- "once a
      thread has started executing a Scalar Unit instruction, it cannot start
      executing its next instruction until the Scalar Unit instruction
      completes, regardless of which unit that next instruction executes in" --
      no per-unit refusal could express, because the thread's next instruction
      is usually offered to a different unit; it is now charged by holding the
      issuing thread at its Wait Gate for exactly the occupancy below
      (``TensixBackend.block_thread_issue``, armed from backends/thcon.py).
      NO NEW NUMBER: the deadline is the occupancy already in this table,
      already charged at the low end of its bound, so the interlock inherits
      that floor.
    throughput_ipc: 1
    instructions:
      DMANOP:
        occupancy: 1
        provenance: isa_doc
        source: wh_scalar_unit
        note: >
          Costed here, in the unit the ISA docs put it in, even though
          tensix_instructions.yaml marks it ``ex_resource: TDMA`` (and tt-sim
          therefore dispatches it to the Miscellaneous Unit). See
          units.TDMA.instructions.DMANOP for the other half of the
          cross-reference. Both units give it 1 cycle, so the disagreement is
          about which unit is occupied, not about the cost.
      SETDMAREG:
        occupancy: 1
        provenance: isa_doc
        source: wh_scalar_unit
      REG2FLOP:
        occupancy: { cycles: 2, bound: at_least }
        provenance: isa_doc
        source: wh_scalar_unit
      FLUSHDMA:
        occupancy: { cycles: 2, bound: at_least }
        provenance: isa_doc
        source: wh_scalar_unit
        note: >
          The ">= 2" is doing a lot of work: FLUSHDMA waits on the unpackers /
          packers / mover it names, so its real occupancy is however long that
          takes. tt-sim already models the stall functionally
          (``ScalarUnit.stalled``); this entry is the floor, not the cost.
      # The "3 or 4" family. CMPDMAREG holds the anchor rather than ADDDMAREG
      # only so that ADDDMAREG can merge from it and add a corroboration of its
      # own: attaching one to the shared node would have declared five opcodes
      # corroborated on the strength of measuring one, which is the laundering
      # this field exists to make impossible.
      CMPDMAREG: &thcon_3_or_4
        occupancy: { cycles: 3, max: 4, bound: range }
        provenance: isa_doc
        source: wh_scalar_unit
        note: the doc says "3 or 4" without saying what selects between them.
      MULDMAREG: *thcon_3_or_4
      SUBDMAREG: *thcon_3_or_4
      BITWOPDMAREG: *thcon_3_or_4
      SHIFTDMAREG: *thcon_3_or_4
      ADDDMAREG:
        <<: *thcon_3_or_4
        corroboration: >
          MEASURED ON BLACKHOLE SILICON BY TWO DIFFERENT BENCHMARKS, and it is
          the only entry in either cost file of which that is true.

          perfbench/tensixbench, 2026-08-04, phase A: 2.973 cycles per
          instruction from one issuing thread, in an unrolled burst of TTI_*
          words timed on the math thread. That is the low end of the documented
          3-4 range, and above 1.0 -- so the RISC-V front end is not the
          constraint and the number is the unit refusing instructions.

          perfbench/riscvbench, 2026-08-05, phase T: 2.972 from one thread,
          5.987 from two and 8.995 from three -- a clean 3.0x, i.e. one shared
          unit whose aggregate throughput stays at ~3 cycles per instruction
          however many TRISCs feed it. Its phase Q reaches the same number a
          third way, from a construction that shares nothing with either: a
          burst of ADDDMAREGs with ckernel::tensix_sync() inside the timed
          region, so it cannot return until the pipe has drained, gives exactly
          3.000 / 5.920 / 9.000 cycles per instruction per thread over
          n = 16..128.

          A DIFFERENT INSTRUMENT, NOT A REPEAT. The two benchmarks are separate
          programs with separate kernels, separate probe tables and separate
          analysis harnesses; they share the method (a slope, with an
          empty-body control subtracted) and the device-side clock register.
          Agreement to 0.001 cycles across that is worth more than two runs of
          one of them.

          WHICH OPCODES THIS COVERS. tensixbench also read CMPDMAREG,
          MULDMAREG and SHIFTDMAREG at 2.973 -- they share this entry's
          occupancy and agree with it. SUBDMAREG and BITWOPDMAREG share it too
          and have NEVER been measured. The field is on ADDDMAREG because it is
          the one both instruments touched.

          The "or 4" is untested by all of this: nothing observed selects
          between 3 and 4, and every reading above is the low end. THREE RUNS,
          ON ONE CARD, one operator, two days: tt_sim/perf/datasets/
          tensixbench-blackhole.csv (KMD 2.9.0) and riscvbench-blackhole.csv
          plus riscvbench-blackhole-blocks8.csv (KMD 2.10.0). One part, so
          nothing here speaks to part-to-part variation, and Wormhole is
          untested -- though this page is the Wormhole one and no Blackhole
          ScalarUnit.md exists to differ from it.
      STOREIND: &thcon_ge3
        occupancy: { cycles: 3, bound: at_least }
        provenance: isa_doc
        source: wh_scalar_unit
      STOREREG: *thcon_ge3
      ATSWAP: *thcon_ge3
      LOADIND: &thcon_ge3_load
        occupancy: { cycles: 3, bound: at_least }
        provenance: isa_doc
        source: wh_scalar_unit
        note: >
          Footnote (dagger): "Occupies the Scalar Unit for >= 3 cycles, though
          the load result isn't delivered until some time later." The delivery
          latency is not quantified -- that is a separate, unpublished number
          from the occupancy recorded here.
      LOADREG: *thcon_ge3_load
      ATINCGET: *thcon_ge3_load
      ATCAS: &thcon_ge15
        occupancy: { cycles: 15, bound: at_least }
        provenance: isa_doc
        source: wh_scalar_unit
      ATINCGETPTR: *thcon_ge15
      RSTDMA:
        provenance: unknown
        note: absent from the Scalar Unit's cycle table; no page in the ISA docs.

  # -------------------------------------------------------------------------
  SYNC:
    isa_doc_name: Sync Unit
    backend: tt_sim/pe/tensix/backends/sync.py
    source: wh_sync_unit
    note: >
      The Blackhole SyncUnit.md table is identical to Wormhole's for every row,
      so no per-arch override. MOP / MOP_CFG carry ex_resource SYNC in
      tensix_instructions.yaml but are really frontend MOP-expander
      instructions, and are sourced from that page instead.
    instructions:
      ATGETM:
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_sync_unit
        note: >
          "Issue up to three per cycle, provided they refer to different
          mutexes" -- i.e. throughput is per-mutex, not per-unit, so no single
          throughput_ipc is recorded. The page also notes ATGETM "executes in a
          single cycle, but it cannot pass through the Wait Gate if some other
          thread is holding the mutex in question"; that stall is a wait-gate
          cost, not unit occupancy.
      ATRELM:
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_sync_unit
      SEMINIT: &sync_sem
        latency: 1
        occupancy: 1
        throughput_ipc: 1
        provenance: isa_doc
        source: wh_sync_unit
        note: >
          "Issue at most one of these per cycle" -- the 1 IPC is shared across
          SEMINIT / SEMPOST / SEMGET / STALLWAIT / SEMWAIT and RISCV semaphore
          write-requests, so it is a unit-level budget rather than a per-op one.
      SEMPOST: *sync_sem
      SEMGET: *sync_sem
      SEMWAIT: &sync_wait
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_sync_unit
        note: >
          Execution "consists purely of passing them over to the Wait Gate ...
          where they sit as the Wait Gate's latched wait instruction. The Wait
          Gate will then re-evaluate the instruction's wait condition every
          cycle until it is met." The 1 cycle is the hand-off; the wait itself
          is unbounded and belongs to the wait gate.
      STALLWAIT: *sync_wait
      MOP:
        throughput_ipc: 1
        provenance: isa_doc
        source: wh_mop_expander#performance
        note: >
          A frontend expander, not a Sync Unit instruction. "Upon receiving a
          MOP instruction, a MOP Expander will ingest the MOP instruction and
          then emit a different sequence of instructions, at a rate of one
          instruction per cycle, only slowing down if backpressured from
          downstream." So its occupancy is the length of its expansion, plus a
          documented "one cycle transition penalty" if the next instruction is
          not itself a MOP. No fixed latency to record.
      MOP_CFG:
        throughput_ipc: 1
        provenance: isa_doc
        source: wh_mop_expander#performance
        note: >
          "While not processing MOP or MOP_CFG instructions, each MOP Expander
          can ingest one instruction per cycle and emit one instruction per
          cycle."
      STREAMWAIT:
        arch: blackhole
        provenance: unknown
        note: >
          Blackhole-only and in tt_sim's UNMODELLED_BLACKHOLE_INSTRUCTIONS. It
          stalls until a NoC stream reaches a phase / message count, so its
          cost is a wait, not a fixed occupancy; no number is published.

  # -------------------------------------------------------------------------
  CFG:
    isa_doc_name: Configuration Unit
    backend: tt_sim/pe/tensix/backends/config.py
    source: wh_config_unit
    note: >
      Wormhole and Blackhole publish separate tables for this unit and they do
      not agree in shape: Wormhole expresses the limits as prose in a
      "Throughput" column, Blackhole as an explicit IPC column plus an IPC-group
      pipeline (stages -4..+1). The shared numbers happen to match, so the base
      table is Wormhole's and ``arch_overrides.blackhole`` carries the two
      Blackhole-only opcodes and the IPC-group note.

      ONLY BLACKHOLE'S ENTRIES CARRY ``ipc_group``, and the asymmetry is
      deliberate. Blackhole's table has a literal "IPC group" column whose two
      values are transcribed below; Wormhole's table has no such column, and
      although its prose partitions the unit the same way (SETC16 "one per
      thread per cycle" against RMWCIB / RDCFG "at most one of these per
      cycle"), reading a grouping out of prose is an inference and the
      consequence of getting one wrong is an instruction let through that the
      hardware would have stalled. Wormhole therefore keeps whole-unit
      occupancy, which is inert there in any case: every entry in its table is
      one cycle, so nothing ever holds the unit.
    instructions:
      SETC16:
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_config_unit
        note: >
          "Issue one per thread per cycle" -- three threads can each issue one
          in the same cycle, so the unit-level throughput is 3, not 1.
      WRCFG:
        latency: 2
        throughput_ipc: 1
        occupancy: 1
        provenance: isa_doc_derived
        source: wh_config_unit
        derivation: occupancy = 1 / throughput_ipc
        note: >
          "Note that excessive use of WRCFG from one thread can starve RMWCIB
          and RDCFG from other threads", and can also starve RISCV read/write
          requests against TENSIX_CFG_BASE. That contention is not expressible
          as a per-op constant.

          Independently corroborated in the vendor LLK, which pads "to ensure
          WRCFG instruction has finished, since it takes 2 cycles"
          (tm_llk_unpack_ab_matmul:84,114) -- one of the few places a tt-metal
          comment and the ISA docs agree on a number exactly.
      RMWCIB0: &cfg_rmwcib
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_config_unit
        isa_doc_name: RMWCIB
        note: >
          "Issue at most one of these per cycle, provided neither RDCFG nor
          WRCFG issued in previous cycle by any thread" -- a cross-thread,
          cross-op constraint, so no per-op throughput_ipc is recorded. The
          four RMWCIBn opcodes in tensix_instructions.yaml are the one RMWCIB
          instruction with different byte selects.
      RMWCIB1: *cfg_rmwcib
      RMWCIB2: *cfg_rmwcib
      RMWCIB3: *cfg_rmwcib
      RDCFG:
        latency: { cycles: 2, bound: at_least }
        occupancy: 1
        provenance: isa_doc
        source: wh_config_unit
        corroboration: >
          Blackhole silicon, 2026-08-04, phase A of perfbench/tensixbench:
          0.998 cycles per instruction from one issuing thread, 1.961 from
          two and 2.952 from three -- 3.0x scaling, i.e. one shared unit
          accepting one instruction per cycle across all three threads. That
          is the "at most one of these per cycle" sentence measured instead of
          read, and it is what a 1-cycle occupancy predicts and a 2-cycle one
          does not.

          TWO RUNS, ON ONE CARD. The primary dataset is
          tt_sim/perf/datasets/tensixbench-blackhole.csv (firmware bundle
          19.6.0, KMD 2.9.0, --blocks 32 --iters 64 --dvalid-once) and its
          header carries the rest. The figures above survived a change of
          benchmark configuration that invalidated the MATH probes entirely:
          the tracked control run tensixbench-blackhole-dvalid-per-thread.csv
          reads 0.998 / 1.957 / 2.950 for RDCFG, agreeing to three decimal
          places, because the dvalid setup that confounded the matrix probes
          touches nothing the config unit does. Two datasets, one card, one
          operator, one clock state -- still not replication on a second part.
          This field corroborates the isa_doc number above; it is not the
          source of it and it does not change the provenance rank. See
          docs/plans/tensix-cost-benchmark.md.
        note: >
          LATENCY AND OCCUPANCY ARE DIFFERENT NUMBERS HERE, and conflating
          them was this entry's original error. Until 2026-08-04 the occupancy
          read ">= 2" -- set equal to the documented *latency* on the grounds
          that the Wormhole page gives RDCFG no separate throughput figure. It
          does give one: RDCFG shares the RMWCIB row's "issue at most one of
          these per cycle", which is a 1-cycle occupancy, and Blackhole states
          the same thing as a number ("everything other than SETC16 is part of
          the same IPC group, and sustained throughput across the entire group
          is limited to one instruction per cycle"). WRCFG two entries up has
          the identical shape -- latency 2, occupancy 1 -- so this entry, not
          that one, was the anomaly.

          The ">= 2" LATENCY IS UNCHANGED AND STILL UNTESTED. It is the time
          until the destination GPR holds the value; the benchmark that
          produced the corroboration above measures issue occupancy only (it
          runs no dependent chain, so no latency is observable to it at all).
          The document and the silicon are not in conflict; they were being
          read as answers to the same question and they are not.

          Blackhole adds that the instruction "can potentially occupy stage 1
          for multiple cycles if there is GPR write contention" -- an
          occupancy that stretches under contention rather than a larger
          constant, and not expressible as a per-op number. The measurement
          above was uncontended.
      CFGSHIFTMASK:
        arch: blackhole
        latency: 2
        throughput_ipc: 0.5
        occupancy: 2
        ipc_group: Config
        provenance: isa_doc_derived
        source: bh_config_unit
        derivation: occupancy = 1 / throughput_ipc
        note: >
          The only instruction that halves the Config IPC group's sustained
          throughput -- it "requires two cycles in stage 0".

          It is also the only entry in either arch's whole file whose occupancy
          exceeds one cycle *and* whose unit publishes IPC groups, so it is the
          single reason ``ipc_group`` is read at all: its 2-cycle hold is
          charged against ``Config`` and leaves ``ThreadConfig`` -- i.e.
          SETC16 -- free, which is what the Blackhole table's group column says
          and what a whole-unit hold got wrong.
      STREAMWRCFG:
        arch: blackhole
        latency: { cycles: 5, bound: at_least }
        throughput_ipc: 1
        occupancy: 1
        ipc_group: Config
        provenance: isa_doc_derived
        source: bh_config_unit
        derivation: occupancy = 1 / throughput_ipc
        note: >
          Blackhole-only, and in tt_sim's UNMODELLED_BLACKHOLE_INSTRUCTIONS.
          The ">= 5" is the pipeline depth: it enters at stage -4 and the
          config write lands at stage 0.

  # -------------------------------------------------------------------------
  TDMA:
    isa_doc_name: Miscellaneous Unit
    backend: tt_sim/pe/tensix/backends/misc.py
    source: wh_misc_unit
    note: >
      Named TDMA by ``ex_resource`` in tensix_instructions.yaml but it is the
      ISA docs' Miscellaneous Unit. One blanket sentence covers every
      instruction: "All Miscellaneous Unit instructions execute in a single
      cycle, and the Miscellaneous Unit can accept one instruction per thread
      per cycle." So each entry below is that sentence applied, not a separate
      published figure.
    instructions:
      SETADC: &misc_1cyc
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_misc_unit
      SETADCXY: *misc_1cyc
      SETADCXX: *misc_1cyc
      SETADCZW: *misc_1cyc
      INCADCXY: *misc_1cyc
      INCADCZW: *misc_1cyc
      ADDRCRXY: *misc_1cyc
      ADDRCRZW: *misc_1cyc
      SETDVALID: *misc_1cyc
      DMANOP:
        provenance: unknown
        note: >
          Carries ex_resource TDMA in tensix_instructions.yaml but the ISA docs
          place DMANOP in the Scalar Unit (ThCon), where it is 1 cycle -- see
          units.THCON.instructions.DMANOP. Recorded here only so the mismatch
          between the two tables is visible rather than silent.

  # -------------------------------------------------------------------------
  PACK:
    isa_doc_name: Packers
    backend: tt_sim/pe/tensix/backends/packer.py
    source: wh_packers
    note: >
      There is no per-op latency table for the packers -- the ISA docs describe
      the issue constraint and the L1 bandwidth, and nothing in between. What
      *is* documented, and is the useful half for a back-pressure model: "At
      most one of these instructions can be started per cycle ... the issuing
      Tensix thread will be blocked until the packers referenced by the
      instruction have _accepted_ the work, and then the thread can proceed on
      to its next instruction. To wait for the packers to have finished the
      work, use STALLWAIT." So issue cost is 1 cycle and completion cost is a
      function of the datum count and the L1 port, not of the opcode.

      This is the largest honest gap in the file. A search of ttsim and
      tt-metal 0.74 for a packer datums-per-cycle or cycles-per-tile figure
      found nothing: tt-metal has the unpacker's 80 B/cycle ceiling but no
      packer equivalent, and its LLK performance-counter doc only describes how
      to *measure* packer-busy cycles, not what they are. So the packer's
      completion cost is left unmodelled rather than estimated.
    l1_bandwidth:
      writes_per_packer_per_cycle: { bits: 128, count: 1 }
      packers: 4
      atomic_accumulate_period_cycles: 5
      non_atomic_accumulate_period_cycles: 2
      provenance: isa_doc
      source: wh_l1#port-assignments
      note: >
        "There are four packers, each theoretically capable of one 128-bit
        write per cycle, or one 128-bit atomic accumulate (4 lanes of 32-bit or
        8 lanes of 16-bit) every five cycles, or one 128-bit non-atomic
        accumulate every two cycles. Port contention and bank contention can
        reduce this."
    instructions:
      PACR:
        occupancy: 1
        provenance: isa_doc
        source: wh_packers
        note: >
          The 1 cycle is the *issue* cost ("at most one of these instructions
          can be started per cycle"), not the time the packers take to drain
          the work. The drain has no published per-op figure; use
          ``l1_bandwidth`` above.
      PACR_SETREG:
        occupancy: 1
        provenance: isa_doc
        source: wh_packers
        note: >
          Shares PACR's one-start-per-cycle budget. Its register write "will
          occur _after_ all earlier PACR instructions have completed all of
          their late format conversions", so its completion is ordered behind
          an unbounded amount of packer work.
      TBUFCMD:
        provenance: unknown
        note: no page and no timing in the ISA docs.

  # -------------------------------------------------------------------------
  UNPACK:
    isa_doc_name: Unpackers
    backend: tt_sim/pe/tensix/backends/unpacker.py
    source: wh_unpacr#performance
    note: >
      The unpacker is the clearest case in the whole table of a cost that is
      not a constant: a fixed address-calculation phase, then a data phase
      whose length is set by the byte count and the configured throttle mode.
      Both halves are documented, so both are recorded -- the fixed part as
      instruction occupancy, the variable part as ``l1_bandwidth``.
    l1_bandwidth:
      throttle_modes:
        x1: { bytes_per_cycle: 16, throttle_mode_value: 0 }
        x2: { bytes_per_cycle: 32, throttle_mode_value: 1 }
        x4: { bytes_per_cycle: 64, throttle_mode_value: 2 }
      # "tileize always runs at x4, regardless of Throttle_mode" -- the one
      # forced mode tt-sim can reach (the others force modes tt-sim rejects:
      # compressed data, UpsampleZeroes, BFP2). Named by mode key so the number
      # is stated exactly once, in the table above.
      tileize_forced_mode: x4
      provenance: isa_doc
      source: wh_unpacr#performance
      note: >
        Selected by ConfigState.THCON_SEC[WhichUnpacker].Throttle_mode ("0
        means x1, 1 means x2, and 2 means x4"), but constrained by mode:
        DiscontiguousInputRows always wants x4; !IsUncompressed,
        UpsampleZeroes >= 3 and BFP2/BFP2a always want x1. When both unpackers
        are active they interfere -- the ISA doc has a 3x3 table of what each
        actually gets, which is contention, not a per-op cost, and so is not
        reproduced here. CONSUMED since 2026-08-06 by
        UnitCostModel.unpack_data_phase_cycles (tt_sim/perf/model.py): an
        UNPACR's data phase is charged ceil(transfer_bytes / rate) as unit
        occupancy, with the rate chosen exactly as this note describes. The
        interference table stays unconsumed: it gives sustained rates for two
        *simultaneously streaming* unpackers, and tt-sim charges each transfer
        at issue with no arbitration between the two units -- charging each
        unpacker its own uncontended rate is the floor.
    joint_bandwidth:
      bytes_per_cycle: 80
      provenance: vendor_source
      source: tm_reduce_scatter#L221-237
      note: >
        The ISA docs give the per-unpacker rates (above) and a qualitative
        interference table, but no joint ceiling in bytes. tt-metal states one:
        "Each can run at up to x4 speed (64 B/cycle), but their joint maximum
        is five 128-bit reads per cycle = 80 B/cycle. This limit applies to all
        architectures". That is consistent with the ISA docs' L1 page, which
        says both unpackers together "can theoretically jointly achieve five
        128-bit reads from L1 per cycle" (wh_l1) -- so the *five reads* half is
        isa_doc and only the conversion to 80 B/cycle comes from the vendor.
        DELIBERATELY UNCONSUMED by the 2026-08-06 wiring: it is a *shared*
        constraint whose division between the two unpackers no source states
        in a per-transfer form (the 3x3 interference table above is sustained
        rates, not arbitration), so each unpacker is charged its own throttle
        rate and the joint ceiling is recorded here as the known under-charge
        -- the honest floor. See docs/plans/cost-model.md, "Unpacker and mover
        occupancy".
    instructions:
      UNPACR:
        occupancy: { cycles: 2, bound: at_least }
        provenance: isa_doc
        source: wh_unpacr#performance
        note: >
          "An UNPACR instruction spends at least two cycles calculating the
          initial input address: uncompressed data requires exactly two cycles,
          whereas compressed data requires more. For the duration of these
          cycles, the issuing thread cannot start its next instruction, nor can
          any other thread start an UNPACR instruction." That is a precise
          occupancy for the uncompressed case and a floor for the compressed
          one. The subsequent data movement is pipelined at the
          ``l1_bandwidth`` rate above and is not part of this occupancy.
          CONSUMED since 2026-08-06, with two scoping choices made where it is
          charged (backends/unpacker.py): the 2 is charged to the datum-moving
          UNPACR form only, because this Performance section is
          UNPACR_Regular.md's -- the IncrementContextCounter and FlushCache
          forms have no published timing and are charged nothing; and the
          cross-unpacker half of the sentence ("nor can any other thread start
          an UNPACR", i.e. on EITHER unpacker) is not modelled -- the charge
          holds the issuing unpacker only, an under-charge in the floor
          direction.

          THE ISSUING-THREAD HALF IS SOURCED AND STILL NOT CHARGED, AND THE
          BLOCKER IS A MECHANISM RATHER THAN A NUMBER (2026-08-11, ROADMAP
          item 3). "For the duration of these cycles, the issuing thread
          cannot start its next instruction" is the same shape as the Scalar
          Unit's interlock, which that item DID wire
          (``TensixBackend.block_thread_issue``), and it needs no new number:
          the deadline would be the 2 above. Wiring it turns three Wormhole
          value guards red -- softplus / tilize / untilize all raise
          SrcDvalidError -- and the fault is on the other side of the Src
          handshake, not in this charge: tt-sim performs an unpack and flips
          its Src AllowedClient in the tick the instruction retires, where the
          hardware flips it at the END of a pipelined transfer. The LLK
          datacopy loop leans on a one-cycle margin between the unpack
          thread's UNPACR_NOP dvalid set and the math thread's SETRWC release,
          and a correctly anchored two-cycle interlock spends exactly that
          margin. So this stays uncharged until the unpacker's dvalid flip is
          timed against its own occupancy -- a change to the functional model,
          not to this table. See docs/plans/cost-model.md.
      UNPACR_NOP:
        occupancy: 1
        provenance: isa_doc
        source: wh_unpackers
        note: >
          One of UNPACR_NOP's five modes is literally documented as "Occupy
          Unpacker for one cycle" (UNPACR_NOP_Nop.md). The other four modes
          (ZEROSRC, SETDVALID, SETREG, OverlayClear) are sequenced with UNPACR
          but have no separately published cost.

  # -------------------------------------------------------------------------
  XMOV:
    isa_doc_name: Mover
    backend: tt_sim/pe/tensix/backends/mover.py
    source: wh_xmov
    note: >
      A single instruction with a documented issue cost and a documented
      background transfer rate -- and, unusually, the transfer rates are
      *measured* rather than theoretical, which the ISA doc says explicitly.
      The full mover cost model (bytes / rate, plus contention) lives in
      tt_sim/perf/unit_costs.yaml under ``mover``.
    instructions:
      XMOV:
        occupancy: 1
        provenance: isa_doc
        source: wh_xmov
        note: >
          "The thread issuing an XMOV instruction will be automatically stalled
          until the mover is able to _start_ work, at which point XMOV will
          execute in a single cycle - the mover proceeds with the task in the
          background." So 1 cycle is the issue cost once the mover is free; the
          transfer duration is separate and is bandwidth-derived, and STALLWAIT
          condition C12 is what waits for it. Since 2026-08-06 the transfer
          duration IS charged, as mover-unit occupancy, from the ``mover``
          section of tt_sim/perf/unit_costs.yaml (MoverCostModel in
          tt_sim/perf/model.py) -- "stalled until the mover is able to start
          work" is exactly what a unit occupancy models. This entry's 1 stays
          the floor for any transfer the rates cannot price.

  # -------------------------------------------------------------------------
  NONE:
    isa_doc_name: (no backend unit)
    source: wh_misc_unit
    note: >
      ``ex_resource: NONE`` in tensix_instructions.yaml. NOP is a
      Miscellaneous Unit instruction despite the marker; REPLAY is a frontend
      expander.
    instructions:
      NOP:
        latency: 1
        occupancy: 1
        provenance: isa_doc
        source: wh_misc_unit
        note: >
          Listed under "instructions which live in the Miscellaneous Unit
          because they don't fit anywhere else", and covered by that unit's
          blanket single-cycle statement.
      REPLAY:
        throughput_ipc: 1
        provenance: isa_doc
        source: wh_replay#performance
        note: >
          A Replay Expander instruction, so its cost is the length of what it
          replays: "For the next Count - 1 cycles (or longer, if backpressured
          from downstream), it will not ingest anything ... but it will emit
          one instruction per cycle from its ReplayBuffer." With Load = true
          and Exec = false it instead ingests one per cycle for Count cycles.
          Count is an instruction field, so there is no constant to record.
      RESOURCEDECL:
        arch: blackhole
        provenance: unknown
        note: >
          Blackhole-only and in tt_sim's UNMODELLED_BLACKHOLE_INSTRUCTIONS. It
          declares resources for the Tensix-TRISC sync mechanism rather than
          doing work; no timing published.

# ---------------------------------------------------------------------------
# Per-architecture differences.
# ---------------------------------------------------------------------------
# Deep-merged over ``units`` by the loader. This mirrors how ArchProfile
# handles arch variation -- one set of fields, per-arch values -- rather than
# the two-whole-files pattern of tensix_backend_cfg.yaml /
# tensix_backend_cfg_blackhole.yaml, because the per-op costs are ~95%
# identical between the two arches and duplicating them would guarantee drift.
# Instructions that exist on only one arch are marked ``arch:`` in place
# instead, matching how tensix_instructions.yaml keeps Blackhole's superset
# opcodes in the shared table.
arch_overrides:
  wormhole: {}
  blackhole:
    units:
      CFG:
        note: >
          Blackhole restructures this unit around IPC groups: "everything other
          than SETC16 is part of the same IPC group, and sustained throughput
          across the entire group is limited to one instruction per cycle (or
          half an instruction per cycle if CFGSHIFTMASK is used)". SETC16 keeps
          IPC 3 (one per thread); every other instruction, plus RISCV and Mover
          requests, contends for a single shared cycle in pipeline stage 0.

          The page's table has an "IPC group" column, and ``ipc_group`` on each
          entry below is that column copied out: SETC16 alone is
          ``ThreadConfig``, and STREAMWRCFG / WRCFG / CFGSHIFTMASK / RMWCIB /
          RDCFG are all ``Config``. The two names are the doc's, not this
          file's. That column is the whole reason the mechanism can charge
          occupancy per group -- ``tt_sim/perf/model.py`` reads it and
          ``TensixBackendUnit`` holds one deadline per group -- and it is the
          only such column published for any Tensix unit.
        source: bh_config_unit
        instructions:
          SETC16:
            latency: 1
            occupancy: 1
            throughput_ipc: 3
            ipc_group: ThreadConfig
            provenance: isa_doc
            source: bh_config_unit
            note: >
              Blackhole states the IPC as a number (3) where Wormhole states it
              as prose ("issue one per thread per cycle"). Same behaviour,
              recorded from the arch's own table.

              The IPC group is the interesting half: SETC16 is the ONLY member
              of ``ThreadConfig``, which is why a CFGSHIFTMASK holding the
              ``Config`` group does not stall it.
          # The rest of the unit's opcodes: the "Config" IPC group, verbatim
          # from the same column. Costs are unchanged from the Wormhole base
          # table above -- these overrides add the group and nothing else, and
          # the deep merge keeps every other field.
          WRCFG:
            ipc_group: Config
          RMWCIB0: &bh_cfg_group
            ipc_group: Config
          RMWCIB1: *bh_cfg_group
          RMWCIB2: *bh_cfg_group
          RMWCIB3: *bh_cfg_group
          RDCFG:
            ipc_group: Config
      UNPACK:
        l1_bandwidth:
          # Blackhole's own fetch-speed differences, transcribed from the
          # shared UNPACR_Regular.md functional model's explicit
          # ``TTArchitecture == Blackhole`` conditionals (the BlackholeA0 tree
          # holds a stub pointing at the Wormhole file, with arch differences
          # "conditionalized inline using TTArchitecture"). The Performance
          # prose itself lists only x1/x2/x4; these three facts are stated in
          # the pseudocode, each with its own quoted line, and the reference
          # simulator (ttsim, tensix.cpp) carries the identical logic under
          # ``TT_ARCH_VERSION == 1``. Left out of the shared table above so
          # that Wormhole -- where "x8 ThrottleMode is illegal" per the same
          # pseudocode -- can never read them.
          blackhole_throttle:
            x8: { bytes_per_cycle: 128, throttle_mode_value: 3 }
            x4_wide: { bytes_per_cycle: 128, throttle_mode_value: 2, min_datum_bytes: 2 }
            default_mode: { byte_datums_value: 3, wider_datums_value: 2 }
            provenance: isa_doc
            source: wh_unpacr#functional-model
            note: >
              Three quoted lines, in the order the fields above record them:
              "x8 ThrottleMode is illegal on Wormhole" (so mode 3 is legal on
              Blackhole, and ThrottleBytes = 16u << ThrottleMode gives 128);
              "ThrottleBytes = 128; // upgrade to x4 '2x'" when
              "(TTArchitecture == Blackhole) && (ThrottleMode == 2) &&
              (DatumSizeBytes >= 2)"; and "ThrottleMode = (DatumSizeBytes ==
              1) ? 3 : 2; // 8-bit modes use x8, others use x4" when
              "!ConfigState.THCON_SEC[0].REG1_ovrd_default_throttle_mode" (a
              Blackhole-only config bit; note the doc indexes THCON_SEC[0]
              for both unpackers). Consumed by
              UnitCostModel.unpack_data_phase_cycles. Not charging these
              would bill Blackhole's data phase at up to twice its documented
              rate, which is the over-charging direction the bounds policy
              forbids.
